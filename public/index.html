<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Меню — Прилавок</title>
<style>
:root{--bg:#f6f6f4;--card:#fff;--text:#171717;--muted:#777;--line:#e8e8e5;--accent:#171717;--accentText:#fff;--soft:#efefec;--radius:20px}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",sans-serif;-webkit-font-smoothing:antialiased}
button,input,textarea{font:inherit}button{cursor:pointer;border:0}.wrap{max-width:760px;margin:auto;padding:0 16px 110px}.hero{padding:28px 4px 18px}.brand{font-size:13px;color:var(--muted);letter-spacing:.08em;text-transform:uppercase}.hero h1{font-size:34px;line-height:1.05;margin:7px 0 8px}.hero p{margin:0;color:var(--muted)}
.tracking-link{display:block;width:100%;margin:0 0 12px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;font-weight:700;text-align:center}.tracking-card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:18px;margin:0 0 18px;display:none}.tracking-title{font-size:20px;font-weight:750;margin-bottom:4px}.tracking-id{font-size:13px;color:var(--muted);margin-bottom:16px}.status-line{display:flex;align-items:center;gap:10px}.status-check{width:24px;font-size:24px;line-height:1;flex:none}.status-text{font-size:18px;font-weight:750}.status-note{font-size:13px;color:var(--muted);margin-top:6px}.tracking-items{margin-top:16px;padding-top:14px;border-top:1px solid var(--line)}.tracking-item{display:flex;justify-content:space-between;gap:10px;padding:7px 0}.tracking-actions{display:flex;gap:8px;margin-top:16px}.tracking-actions button{flex:1;background:var(--soft);border-radius:12px;padding:11px;font-weight:700}.tracking-actions button.primary{background:#171717;color:#fff}
.cats{display:flex;gap:8px;overflow:auto;padding:4px 0 16px;scrollbar-width:none}.cats::-webkit-scrollbar{display:none}.cat{white-space:nowrap;padding:10px 15px;border-radius:999px;background:var(--card);border:1px solid var(--line);color:#444}.cat.active{background:var(--accent);color:var(--accentText);border-color:var(--accent)}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.product{background:var(--card);border-radius:var(--radius);overflow:hidden;border:1px solid var(--line);display:flex;flex-direction:column;min-height:250px}.pic{height:150px;background:var(--soft);display:flex;align-items:center;justify-content:center;overflow:hidden}.pic img{width:100%;height:100%;object-fit:cover}.noimg{font-size:42px;opacity:.45}
.product{cursor:pointer;transition:transform .22s cubic-bezier(.2,.8,.2,1),box-shadow .22s ease,border-color .22s ease;animation:cardIn .42s both}.product:hover{transform:translateY(-3px);box-shadow:0 10px 28px rgba(0,0,0,.07)}.product:active{transform:scale(.975)}.product .pic img{transition:transform .45s cubic-bezier(.2,.8,.2,1)}.product:hover .pic img{transform:scale(1.025)}
.cat,.add,.detail-add,.cartbtn,.checkout,.switch,.back-btn,.tracking-link,.actions button,.detail-qty button,.qty button{transition:transform .16s ease,background-color .2s ease,color .2s ease,border-color .2s ease,box-shadow .2s ease}.cat:active,.add:active,.detail-add:active,.cartbtn:active,.checkout:active,.switch:active,.back-btn:active,.tracking-link:active,.actions button:active,.detail-qty button:active,.qty button:active{transform:scale(.96)}
@keyframes cardIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}@keyframes addPop{0%{transform:scale(.82)}55%{transform:scale(1.12)}100%{transform:scale(1)}}@keyframes cartPulse{0%{transform:scale(1)}35%{transform:scale(1.035)}70%{transform:scale(.995)}100%{transform:scale(1)}}@keyframes cartGlow{0%{box-shadow:0 0 0 0 rgba(23,23,23,.18)}100%{box-shadow:0 0 0 12px rgba(23,23,23,0)}}@keyframes qtyPop{0%{transform:scale(.72);opacity:.4}70%{transform:scale(1.16)}100%{transform:scale(1);opacity:1}}.add-pop{animation:addPop .34s cubic-bezier(.2,.9,.25,1)}.cartbtn.cart-pulse{animation:cartPulse .42s cubic-bezier(.2,.9,.25,1),cartGlow .5s ease-out}.qty span.qty-pop,.detail-qty span.qty-pop{animation:qtyPop .3s cubic-bezier(.2,.9,.25,1)}@keyframes sheetIn{from{opacity:0;transform:translateY(28px)}to{opacity:1;transform:translateY(0)}}@keyframes detailIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}@keyframes cartIn{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}.sheet{animation:sheetIn .28s cubic-bezier(.2,.8,.2,1)}.product-detail.is-open .detail-inner{animation:detailIn .3s cubic-bezier(.2,.8,.2,1)}.cartbar.is-visible{animation:cartIn .28s cubic-bezier(.2,.8,.2,1)}@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important;scroll-behavior:auto!important}}
.product-detail{position:fixed;inset:0;background:var(--bg);z-index:30;display:none;overflow:auto}.detail-inner{max-width:760px;margin:auto;padding:0 16px max(28px,env(safe-area-inset-bottom))}.detail-top{position:sticky;top:0;z-index:2;display:flex;align-items:center;justify-content:space-between;padding:12px 0;background:rgba(246,246,244,.9);backdrop-filter:blur(16px)}.back-btn{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 14px;font-weight:650}.detail-image{width:100%;height:min(62vh,520px);border-radius:24px;overflow:hidden;background:var(--soft);display:flex;align-items:center;justify-content:center}.detail-image img{width:100%;height:100%;object-fit:cover}.detail-noimg{font-size:72px;opacity:.4}.detail-content{padding:20px 4px}.detail-name{font-size:30px;line-height:1.08;font-weight:750;margin-bottom:9px}.detail-desc{font-size:16px;line-height:1.5;color:var(--muted);white-space:pre-wrap}.detail-bottom{display:flex;align-items:center;justify-content:space-between;gap:14px;margin-top:24px}.detail-price{font-size:22px;font-weight:750}.detail-add{background:var(--accent);color:#fff;border-radius:14px;padding:14px 20px;font-weight:700;font-size:16px}.detail-qty{display:flex;align-items:center;background:var(--soft);border-radius:14px;overflow:hidden}.detail-qty button{width:44px;height:46px;background:transparent;font-size:23px}.detail-qty span{min-width:32px;text-align:center;font-weight:700;font-size:17px}.body{padding:13px;display:flex;flex-direction:column;gap:7px;flex:1}.name{font-weight:650;font-size:17px}.desc{font-size:13px;line-height:1.35;color:var(--muted);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}.bottom{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:auto}.price{font-weight:700;font-size:16px}.add{background:var(--accent);color:var(--accentText);border-radius:12px;padding:9px 13px;font-weight:650}.qty{display:flex;align-items:center;background:var(--soft);border-radius:12px;overflow:hidden}.qty button{width:34px;height:36px;background:transparent;font-size:20px}.qty span{min-width:25px;text-align:center;font-weight:650}
.empty{text-align:center;color:var(--muted);padding:50px 20px}.cartbar{position:fixed;left:0;right:0;bottom:0;padding:12px max(16px,calc((100vw - 760px)/2 + 16px));padding-bottom:max(12px,env(safe-area-inset-bottom));background:rgba(246,246,244,.9);backdrop-filter:blur(16px);border-top:1px solid var(--line);display:none}.cartbtn{width:100%;background:#171717;color:#fff;border-radius:16px;padding:15px 17px;display:flex;justify-content:space-between;font-weight:700}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.42);display:none;align-items:flex-end;z-index:40;overscroll-behavior:contain;touch-action:none}.sheet{width:100%;max-width:760px;margin:0 auto;background:var(--card);border-radius:26px 26px 0 0;height:min(86dvh,760px);max-height:calc(100dvh - max(12px,env(safe-area-inset-top)));overflow:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;padding:18px 16px calc(26px + env(safe-area-inset-bottom));touch-action:pan-y;transform:translateY(0);will-change:transform}.handle{width:48px;height:5px;background:#d2d2cf;border-radius:5px;margin:0 auto 18px;cursor:grab;touch-action:none}.sheet h2{margin:0 0 16px;font-size:25px}.row{display:flex;justify-content:space-between;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}.row:last-child{border-bottom:0}.itemmain{flex:1}.itemname{font-weight:650}.itemsub{font-size:13px;color:var(--muted);margin-top:3px}.actions{display:flex;gap:7px;align-items:center}.actions button{width:32px;height:32px;border-radius:10px;background:var(--soft)}.section{margin-top:18px}.section label{display:block;font-size:13px;color:var(--muted);margin-bottom:7px}.switches{display:grid;grid-template-columns:1fr 1fr;gap:8px}.switch{padding:12px;border:1px solid var(--line);border-radius:13px;background:#fff;text-align:left}.switch.active{border-color:#171717;background:#171717;color:#fff}.field{width:100%;padding:13px;border:1px solid var(--line);border-radius:13px;outline:0;background:#fff;margin-bottom:8px}.field:focus{border-color:#999}.checkout{margin-top:18px;background:#171717;color:#fff;border-radius:15px;padding:15px;width:100%;font-weight:700}.checkout:disabled{opacity:.4}.total{display:flex;justify-content:space-between;font-size:18px;font-weight:750;padding:15px 0}.success{text-align:center;padding:40px 10px}.success .icon{font-size:52px}.success h2{margin:12px 0 7px}.muted{color:var(--muted)}.toast{position:fixed;left:50%;bottom:92px;transform:translateX(-50%);background:#171717;color:#fff;padding:11px 15px;border-radius:12px;display:none;z-index:20;font-size:14px}
@media(min-width:650px){.grid{grid-template-columns:repeat(3,minmax(0,1fr))}.pic{height:160px}}
.phone-field{display:flex;align-items:center;gap:10px;width:100%;border:1px solid var(--line);border-radius:13px;margin-bottom:8px;padding:0 13px}.phone-field:focus-within{border-color:#999}.phone-prefix{font-weight:650;flex:none}.phone-field input{min-width:0;width:100%;border:0;outline:0;padding:13px 0;background:transparent}.tracking-card[hidden]{display:none!important}
</style>
</head>
<body>
<div class="wrap">
  <header class="hero"><div class="brand">Проект</div><h1>Меню</h1><p>Выберите блюда и оформите заказ онлайн.</p></header>
  <button id="trackingLink" class="tracking-link" aria-expanded="false" aria-controls="trackingCard" onclick="toggleTracking()">Мои заказы</button>
  <section id="trackingCard" class="tracking-card" hidden aria-live="polite"></section>
  <div id="cats" class="cats"></div>
  <main id="grid" class="grid"></main>
</div>
<div id="productDetail" class="product-detail"><div class="detail-inner"><div class="detail-top"><button class="back-btn" onclick="closeProductDetail()">← Назад</button><div class="brand">Проект</div></div><div id="detailContent"></div></div></div>
<div id="cartbar" class="cartbar"><button class="cartbtn" onclick="openCart()"><span>Корзина · <span id="cartCount">0</span></span><span id="cartTotal">0,00 BYN</span></button></div>
<div id="cartModal" class="modal" onclick="if(event.target===this)closeCart()"><div class="sheet"><div class="handle"></div><h2>Ваш заказ</h2><div id="cartItems"></div><div class="section"><label>Способ получения</label><div class="switches"><button id="pickupBtn" class="switch active" onclick="setType('Самовывоз')">🏠 Самовывоз</button><button id="deliveryBtn" class="switch" onclick="setType('Доставка')">🚗 Доставка</button></div></div><div id="deliveryFields" class="section" style="display:none"><label>Данные для доставки</label><input id="name" class="field" placeholder="Имя"><div class="phone-field"><span class="phone-prefix">+375</span><input id="phone" type="tel" inputmode="tel" autocomplete="tel-national" aria-label="Телефон, код страны +375" placeholder="29 123 45 67" oninput="formatPhoneInput(this)"></div><input id="address" class="field" placeholder="Адрес доставки"><input id="comment" class="field" placeholder="Комментарий к заказу"><div class="muted" style="font-size:13px">Доставка: <span id="deliveryFeeText">0,00 BYN</span></div></div><div id="pickupFields" class="section"><label>Контактные данные</label><input id="namePickup" class="field" placeholder="Имя"><div class="phone-field"><span class="phone-prefix">+375</span><input id="phonePickup" type="tel" inputmode="tel" autocomplete="tel-national" aria-label="Телефон, код страны +375" placeholder="29 123 45 67" oninput="formatPhoneInput(this)"></div><input id="commentPickup" class="field" placeholder="Комментарий к заказу"></div><div class="total"><span>Итого</span><span id="checkoutTotal">0,00 BYN</span></div><button id="submitBtn" class="checkout" onclick="submitOrder()">Оформить заказ</button></div></div>
<div id="successModal" class="modal"><div class="sheet"><div class="success"><div class="icon">✓</div><h2>Заказ принят</h2><p class="muted">Ваш заказ создан. Ниже можно следить за его статусом.</p><button class="checkout" onclick="closeSuccessAndShowTracking()">Следить за заказом</button></div></div></div>
<div id="toast" class="toast"></div>
<script src="/order-validation.js"></script>
<script>
const API=location.origin;let menu={categories:[],products:[]};let cart=[];let activeCat=null;let orderType='Самовывоз';let trackingToken=localStorage.getItem('prilavok_tracking_token')||'';let trackingTimer=null;let trackingOrder=null;
const money=n=>Number(n||0).toLocaleString('ru-RU',{minimumFractionDigits:2,maximumFractionDigits:2})+' BYN';
async function loadMenu(){try{const r=await fetch(API+'/api/menu');if(!r.ok)throw 0;menu=await r.json();renderCats();renderProducts()}catch(e){document.getElementById('grid').innerHTML='<div class="empty" style="grid-column:1/-1">Не удалось загрузить меню.<br>Попробуйте обновить страницу.</div>'}}
function renderCats(){const el=document.getElementById('cats');if(!activeCat||!menu.categories.some(c=>c.id===activeCat))activeCat=menu.categories[0]?.id||null;el.innerHTML=menu.categories.map(c=>`<button class="cat ${c.id===activeCat?'active':''}" data-cat="${c.id}" onclick="setCat('${c.id}')">${esc(c.name)}</button>`).join('')}
function setCat(id){activeCat=id;document.querySelectorAll('.cat').forEach(x=>x.classList.toggle('active',x.dataset.cat===id));renderProducts()}
function renderProducts(){const ps=activeCat?menu.products.filter(p=>p.category_id===activeCat):menu.products;const el=document.getElementById('grid');if(!ps.length){el.innerHTML='<div class="empty" style="grid-column:1/-1">В этой категории пока нет товаров.</div>';return}el.innerHTML=ps.map(p=>{const q=cart.find(x=>x.id===p.id)?.qty||0;return `<article class="product" data-product-id="${escAttr(p.id)}" onclick="openProductDetail('${p.id}')"><div class="pic">${p.image_url?`<img src="${escAttr(p.image_url)}" loading="lazy">`:'<div class="noimg">🍽️</div>'}</div><div class="body"><div class="name">${esc(p.name)}</div>${p.description?`<div class="desc">${esc(p.description)}</div>`:''}<div class="bottom"><div class="price">${money(p.price)}</div>${q?`<div class="qty"><button onclick="event.stopPropagation();changeQty('${p.id}',-1)">−</button><span>${q}</span><button onclick="event.stopPropagation();changeQty('${p.id}',1)">+</button></div>`:`<button class="add" onclick="event.stopPropagation();changeQty('${p.id}',1)">Добавить</button>`}</div></div></article>`}).join('')}
function openProductDetail(id){const p=menu.products.find(x=>x.id===id);if(!p)return;const q=cart.find(x=>x.id===id)?.qty||0;document.getElementById('detailContent').innerHTML=`<div class="detail-image">${p.image_url?`<img src="${escAttr(p.image_url)}" alt="${escAttr(p.name)}">`:'<div class="detail-noimg">🍽️</div>'}</div><div class="detail-content"><div class="detail-name">${esc(p.name)}</div>${p.description?`<div class="detail-desc">${esc(p.description)}</div>`:'<div class="detail-desc">Описание товара пока не добавлено.</div>'}<div class="detail-bottom"><div class="detail-price">${money(p.price)}</div>${q?`<div class="detail-qty"><button onclick="changeQty('${p.id}',-1);refreshProductDetail('${p.id}')">−</button><span>${q}</span><button onclick="changeQty('${p.id}',1);refreshProductDetail('${p.id}')">+</button></div>`:`<button class="detail-add" onclick="changeQty('${p.id}',1);refreshProductDetail('${p.id}')">Добавить</button>`}</div></div>`;document.getElementById('productDetail').style.display='block';document.getElementById('productDetail').classList.add('is-open');document.body.style.overflow='hidden';window.scrollTo(0,0)}
function refreshProductDetail(id){openProductDetail(id)}
function closeProductDetail(){const d=document.getElementById('productDetail');d.style.display='none';d.classList.remove('is-open');document.body.style.overflow='';}
function changeQty(id,d){const p=menu.products.find(x=>x.id===id);if(!p)return;let x=cart.find(x=>x.id===id);if(!x&&d>0)cart.push({id,qty:1});else if(x){x.qty+=d;if(x.qty<=0)cart=cart.filter(y=>y.id!==id)}updateCart();updateProductCard(id);animateCartAdd(d)}
function updateProductCard(id){const card=document.querySelector(`.product[data-product-id="${CSS.escape(id)}"]`);if(!card)return;const p=menu.products.find(x=>x.id===id),q=cart.find(x=>x.id===id)?.qty||0,bottom=card.querySelector('.bottom');if(!p||!bottom)return;bottom.innerHTML=`<div class="price">${money(p.price)}</div>${q?`<div class="qty"><button onclick="event.stopPropagation();changeQty('${p.id}',-1)">−</button><span class="qty-pop">${q}</span><button onclick="event.stopPropagation();changeQty('${p.id}',1)">+</button></div>`:`<button class="add" onclick="event.stopPropagation();changeQty('${p.id}',1)">Добавить</button>`}`;card.classList.remove('add-pop');void card.offsetWidth;card.classList.add('add-pop')}
function animateCartAdd(d){if(d<=0)return;const b=document.querySelector('.cartbtn');if(!b)return;b.classList.remove('cart-pulse');void b.offsetWidth;b.classList.add('cart-pulse')}
function updateCart(){const count=cart.reduce((s,x)=>s+x.qty,0);const subtotal=cart.reduce((s,x)=>s+(menu.products.find(p=>p.id===x.id)?.price||0)*x.qty,0);document.getElementById('cartCount').textContent=count;document.getElementById('cartTotal').textContent=money(subtotal);const bar=document.getElementById('cartbar');bar.style.display=count?'block':'none';bar.classList.toggle('is-visible',!!count);if(document.getElementById('cartModal').style.display==='flex')renderCart()}
function renderCart(){const el=document.getElementById('cartItems');el.innerHTML=cart.map(x=>{const p=menu.products.find(p=>p.id===x.id);return `<div class="row"><div class="itemmain"><div class="itemname">${esc(p.name)}</div><div class="itemsub">${money(p.price)} × ${x.qty}</div></div><div class="actions"><button onclick="changeQty('${p.id}',-1)">−</button><b>${x.qty}</b><button onclick="changeQty('${p.id}',1)">+</button></div></div>`}).join('');const subtotal=cart.reduce((s,x)=>s+(menu.products.find(p=>p.id===x.id)?.price||0)*x.qty,0);const fee=orderType==='Доставка'?getDeliveryFee():0;document.getElementById('checkoutTotal').textContent=money(subtotal+fee);document.getElementById('deliveryFeeText').textContent=money(fee)}
function openCart(){const m=document.getElementById('cartModal');m.style.display='flex';document.body.style.overflow='hidden';renderCart()}function closeCart(){const m=document.getElementById('cartModal');m.style.display='none';document.body.style.overflow='';const sh=m.querySelector('.sheet');if(sh){sh.style.transition='';sh.style.transform=''}}
let cartDragStartY=0,cartDragY=0,cartDragging=false;
(function setupCartDrag(){const m=document.getElementById('cartModal'),sh=m?.querySelector('.sheet'),h=m?.querySelector('.handle');if(!m||!sh||!h)return;h.addEventListener('pointerdown',e=>{cartDragging=true;cartDragStartY=e.clientY;cartDragY=0;sh.style.transition='none';h.setPointerCapture?.(e.pointerId)});h.addEventListener('pointermove',e=>{if(!cartDragging)return;cartDragY=Math.max(0,e.clientY-cartDragStartY);sh.style.transform=`translateY(${cartDragY}px)`});const end=e=>{if(!cartDragging)return;cartDragging=false;if(cartDragY>90){sh.style.transition='transform .22s ease';sh.style.transform='translateY(100%)';setTimeout(closeCart,210)}else{sh.style.transition='transform .24s cubic-bezier(.2,.8,.2,1)';sh.style.transform='translateY(0)'}};h.addEventListener('pointerup',end);h.addEventListener('pointercancel',end)})();
function setType(t){orderType=t;document.getElementById('pickupBtn').classList.toggle('active',t==='Самовывоз');document.getElementById('deliveryBtn').classList.toggle('active',t==='Доставка');document.getElementById('deliveryFields').style.display=t==='Доставка'?'block':'none';document.getElementById('pickupFields').style.display=t==='Доставка'?'none':'block';renderCart()}
function getDeliveryFee(){return Number(window.__DELIVERY_FEE||0)}
async function submitOrder(){if(!cart.length)return;const delivery=orderType==='Доставка';const data={orderType,customerName:(document.getElementById(delivery?'name':'namePickup').value||'').trim(),phone:'+375'+(document.getElementById(delivery?'phone':'phonePickup').value||'').trim(),address:delivery?(document.getElementById('address').value||'').trim():'',comment:(document.getElementById(delivery?'comment':'commentPickup').value||'').trim(),items:cart.map(x=>({productId:x.id,quantity:x.qty,comment:null}))};if(!data.customerName||!data.phone||(delivery&&!data.address)){toast('Заполните имя, телефон и адрес для доставки');return}const validationError=OrderValidation.validate(data);if(validationError){toast(validationError);return}data.phone=OrderValidation.normalizePhone(data.phone);const btn=document.getElementById('submitBtn');btn.disabled=true;btn.textContent='Отправляем…';try{const r=await fetch(API+'/api/orders',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(data)});const j=await r.json();if(!r.ok)throw new Error(j.error||'Ошибка');saveTrackingToken(j.trackingToken);closeCart();document.getElementById('successModal').style.display='flex'}catch(e){toast(e.message||'Не удалось отправить заказ')}finally{btn.disabled=false;btn.textContent='Оформить заказ'}}
function statusInfo(status){return ['accepted','in_work','ready','delivering','completed'].includes(status)?['Заказ подтверждён','',true]:status==='new'?['Ожидает подтверждения','',false]:['Статус уточняется','',false]}
function formatPhoneInput(input){let value=input.value.trim();if(/^\+375/.test(value))value=value.slice(4);else if(/^375[\s(\d-]/.test(value)&&value.replace(/\D/g,'').length===12)value=value.slice(3);input.value=value.replace(/\D/g,'').slice(0,9);}
function toggleTracking(){const card=document.getElementById('trackingCard');if(card.hidden)showTracking();else hideTracking();}
function saveTrackingToken(token){trackingToken=String(token||'').trim();if(trackingToken)localStorage.setItem('prilavok_tracking_token',trackingToken);trackingOrder=null;startTrackingPolling()}
function updateTrackingLink(){const b=document.getElementById('trackingLink');if(b)b.style.display='block'}
function showTracking(){const card=document.getElementById('trackingCard');card.hidden=false;card.style.display='block';document.getElementById('trackingLink').setAttribute('aria-expanded','true');if(!trackingToken){card.innerHTML='<div class="muted">У вас пока нет заказов на этом устройстве.</div>';return}if(!trackingOrder)card.innerHTML='<div class="muted">Загружаем заказ…</div>';loadTracking(true);}
function closeSuccessAndShowTracking(){document.getElementById('successModal').style.display='none';showTracking()}
async function loadTracking(scroll){if(!trackingToken)return;try{const r=await fetch(API+'/api/orders/track/'+encodeURIComponent(trackingToken),{cache:'no-store'});if(r.status===404){trackingToken='';localStorage.removeItem('prilavok_tracking_token');updateTrackingLink();trackingOrder=null;document.getElementById('trackingCard').innerHTML='<div class="muted">Заказ не найден.</div>';return}const j=await r.json();if(!r.ok)throw new Error(j.error||'Ошибка');trackingOrder=j.order;renderTracking(j.order);if(scroll)document.getElementById('trackingCard').scrollIntoView({behavior:'smooth',block:'start'})}catch(e){if(scroll){if(!trackingOrder)document.getElementById('trackingCard').innerHTML='<div class="muted">Не удалось загрузить заказ. Закройте и откройте блок, чтобы повторить.</div>';toast('Не удалось загрузить статус заказа')}}}
function renderTracking(o){const card=document.getElementById('trackingCard');if(!card)return;const [label,note,confirmed]=statusInfo(o.status);const items=(o.order_items||[]).map(i=>`<div class="tracking-item"><span>${esc(i.product_name)} × ${Number(i.quantity||0)}</span><b>${money(Number(i.price||0)*Number(i.quantity||0))}</b></div>`).join('');card.innerHTML=`<div class="tracking-title">Ваш заказ</div><div class="tracking-id">${esc(o.external_id||'')}</div><div class="status-line">${confirmed?'<span class="status-check" aria-hidden="true">✓</span>':''}<div><div class="status-text">${esc(label)}</div><div class="status-note">${esc(note)}</div></div></div><div class="tracking-items">${items}<div class="total" style="padding-bottom:0"><span>Итого</span><span>${money(o.total)}</span></div></div><div class="tracking-actions"><button class="primary" onclick="loadTracking(true)">Обновить</button><button onclick="hideTracking()">Скрыть</button></div>`;if(confirmed){clearInterval(trackingTimer);trackingTimer=null;}}
function hideTracking(){const card=document.getElementById('trackingCard');if(card){card.hidden=true;card.style.display='none'}document.getElementById('trackingLink').setAttribute('aria-expanded','false')}
function startTrackingPolling(){updateTrackingLink();if(!trackingToken)return;loadTracking(false);clearInterval(trackingTimer);trackingTimer=setInterval(()=>loadTracking(false),2500)}
function toast(t){const e=document.getElementById('toast');e.textContent=t;e.style.display='block';clearTimeout(window.__toast);window.__toast=setTimeout(()=>e.style.display='none',2800)}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function escAttr(s){return esc(s)}
fetch(API+'/api/config').then(r=>r.json()).then(c=>{window.__DELIVERY_FEE=Number(c.deliveryFee||0)}).catch(()=>{});loadMenu();startTrackingPolling();
</script>
</body></html>
