<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Проект — конструктор меню</title><style>
*{box-sizing:border-box}body{margin:0;background:#111315;color:#fff;font-family:Inter,Arial,sans-serif}.toolbar{position:sticky;top:0;z-index:20;padding:14px 18px;background:#111315eF;border-bottom:1px solid #ffffff12;backdrop-filter:blur(18px)}.bar{max-width:1100px;margin:auto;display:flex;align-items:center;justify-content:space-between;gap:16px}.brand{font-weight:800;letter-spacing:-.02em}.controls{display:flex;gap:8px;align-items:center}.styles{display:flex;gap:5px;padding:4px;background:#ffffff0a;border:1px solid #ffffff12;border-radius:14px}.styles button,.action{border:0;color:#bfc3c7;background:transparent;padding:9px 13px;border-radius:10px;cursor:pointer;font-weight:650}.styles button.active{background:#fff;color:#111}.action{background:#fff;color:#111}.preview{padding:34px 16px}.page{--ink:#124c3c;--paper:#f4efdf;--soft:#dfe5d9;width:210mm;min-height:297mm;margin:0 auto 32px;background:var(--paper);color:var(--ink);padding:15mm 16mm 13mm;box-shadow:0 25px 80px #0009;position:relative;overflow:hidden;font-family:Arial,sans-serif}.mast{display:grid;grid-template-columns:1fr auto;align-items:end;border-bottom:1.4px solid currentColor;padding-bottom:5mm;margin-bottom:8mm}.title{font-size:52pt;font-weight:950;letter-spacing:-.075em;line-height:.78}.project{font-size:12pt;font-weight:800;letter-spacing:.12em}.columns{column-count:2;column-gap:13mm}.category{break-inside:avoid;margin:0 0 8mm}.category h2{font-size:14pt;line-height:1;margin:0 0 4mm;padding-bottom:2mm;border-bottom:1px solid color-mix(in srgb,currentColor 30%,transparent);text-transform:uppercase;letter-spacing:.015em}.item{break-inside:avoid;margin:0 0 3.1mm}.line{display:grid;grid-template-columns:auto 1fr auto;align-items:end;gap:2mm}.name,.price{font-size:10pt;font-weight:800}.dots{border-bottom:1px dotted currentColor;opacity:.35;transform:translateY(-2px)}.desc{font-size:7.3pt;line-height:1.35;opacity:.68;margin-top:1mm;max-width:94%}.foot{position:absolute;left:16mm;right:16mm;bottom:7mm;border-top:1px solid color-mix(in srgb,currentColor 25%,transparent);padding-top:2.5mm;font-size:6.5pt;display:flex;justify-content:space-between;opacity:.65}
/* SWISS EDITORIAL — airy grid, oversized section numerals */
.page.editorial{--ink:#173c32;--paper:#f3f1e9;padding:14mm 15mm;font-family:Helvetica,Arial,sans-serif}.editorial .mast{height:48mm;align-items:start;border:0;border-top:3px solid var(--ink);padding-top:4mm;margin-bottom:9mm}.editorial .title{font-size:70pt;font-weight:400;letter-spacing:-.09em}.editorial .project{font-size:7pt;letter-spacing:.28em;padding-top:2mm}.editorial .columns{column-count:2;column-gap:15mm}.editorial .category{padding-top:10mm;margin-bottom:12mm;border:0}.editorial .category-index{position:absolute;top:0;left:0;font-size:7pt;letter-spacing:.18em;opacity:1}.editorial .category h2{font-size:20pt;font-weight:500;letter-spacing:-.045em;text-transform:none;border:0;padding:0;margin-bottom:6mm}.editorial .item{margin-bottom:4mm}.editorial .name{font-size:9.5pt;font-weight:600}.editorial .price{font-size:9pt}.editorial .dots{border:0}.editorial .desc{font-size:7pt}.editorial .category:nth-child(3n){padding-left:9mm;border-left:1px solid var(--ink)}.editorial.first:before{content:"01";position:absolute;right:14mm;top:44mm;font-size:84pt;font-weight:300;line-height:1;opacity:.055}.editorial.first:after{content:"FOOD · COFFEE · PEOPLE";position:absolute;right:15mm;top:13mm;font-size:6pt;letter-spacing:.3em}

/* RETRO CAFE — framed paper menu, stamps and label modules */
.page.bistro{--ink:#2d241b;--paper:#ead9b6;padding:10mm;border:5mm solid #d34b35;font-family:Georgia,"Times New Roman",serif}.bistro:before{content:"";position:absolute;inset:7mm;border:1px solid #2d241b;pointer-events:none}.bistro .mast{height:43mm;display:block;text-align:center;border:0;margin:0 8mm 8mm;padding-top:4mm}.bistro .title{font-family:Georgia,serif;font-size:47pt;font-weight:700;letter-spacing:.03em}.bistro .project{display:inline-block;margin-top:4mm;padding:2mm 5mm;border:1px solid currentColor;border-radius:50%;font:700 7pt Arial;letter-spacing:.18em;transform:rotate(-3deg)}.bistro .columns{column-count:2;column-gap:9mm;padding:0 8mm}.bistro .category{border:1px solid #2d241b;padding:4mm;margin-bottom:6mm;background:#ead9b6}.bistro .category:nth-child(3n+2){background:#d34b35;color:#fff;border-color:#d34b35;transform:rotate(.35deg)}.bistro .category:nth-child(4n){border-style:dashed;transform:rotate(-.3deg)}.bistro .category-index{font:800 6pt Arial;letter-spacing:.15em}.bistro .category h2{font:700 15pt Georgia;text-align:center;border-bottom:1px double currentColor;padding-bottom:2.5mm}.bistro .name,.bistro .price{font-family:Arial,sans-serif;font-size:8.5pt}.bistro .desc{font-style:italic;font-size:7pt}.bistro.first:after{content:"EST. 2026  •  ПРОЕКТ";position:absolute;left:50%;bottom:14mm;transform:translateX(-50%) rotate(-2deg);font:700 6pt Arial;letter-spacing:.2em;opacity:.6}

/* POSTER NIGHT — asymmetric poster composition */
.page.night{--ink:#f2ead6;--paper:#121310;padding:11mm 12mm;font-family:"Arial Narrow",Arial,sans-serif}.night .mast{height:54mm;border:0;display:block;position:relative;margin-bottom:5mm}.night .title{font-family:Impact,"Arial Black",sans-serif;font-size:88pt;font-weight:400;line-height:.7;letter-spacing:-.015em;color:#f2ead6}.night .project{position:absolute;right:0;bottom:0;background:#e54531;color:#121310;padding:3mm 7mm;font-size:10pt;letter-spacing:.16em;transform:rotate(-2deg)}.night .columns{column-count:2;column-gap:5mm}.night .category{padding:4mm;margin:0 0 5mm;border:0;background:#1d1e1a}.night .category:nth-child(4n+1){background:#e54531;color:#121310}.night .category:nth-child(4n+2){border:1px solid #f2ead655;background:transparent}.night .category:nth-child(4n+3){padding-left:9mm;background:transparent;border-left:5mm solid #e54531}.night .category-index{font-size:6pt;letter-spacing:.22em;color:inherit;opacity:.7}.night .category h2{font-family:Impact,"Arial Black",sans-serif;font-size:18pt;font-weight:400;letter-spacing:.02em;border:0;padding:0;margin-bottom:4mm;color:inherit}.night .name,.night .price{font-size:8.5pt}.night .dots{border-color:currentColor;opacity:.25}.night .desc{font-size:6.8pt}.night.first:before{content:"EAT";position:absolute;right:-8mm;top:84mm;font:400 92pt Impact;color:#e54531;opacity:.09;transform:rotate(90deg)}.night.first:after{content:"MENU / 2026 / DUBROVNO";position:absolute;left:12mm;top:65mm;color:#e54531;font-size:6pt;letter-spacing:.3em}
.continuation{position:absolute;left:16mm;top:7mm;font-size:6pt;letter-spacing:.18em;font-weight:800;opacity:.45}.first .continuation{display:none}
.loading{text-align:center;padding:80px;color:#999}@page{size:A4 portrait;margin:0}@media print{body{background:white}.toolbar{display:none}.preview{padding:0}.page{margin:0;box-shadow:none;page-break-after:always}.page:last-child{page-break-after:auto}}@media(max-width:850px){.bar{align-items:flex-start;flex-direction:column}.controls{width:100%;overflow:auto}.preview{overflow:auto;padding:12px}.toolbar{position:relative}}
</style></head><body><header class="toolbar"><div class="bar"><div class="brand">ПРОЕКТ · PRINT STUDIO</div><div class="controls"><div class="styles"><button data-style="editorial" class="active">Swiss</button><button data-style="bistro">Retro Café</button><button data-style="night">Poster Night</button></div><button class="action" onclick="window.print()">PDF / Печать</button></div></div></header>
<main class="preview" id="preview"><div class="loading">Загружаем актуальное меню…</div></main>
<script>
let menuData=null,current='editorial';const money=v=>new Intl.NumberFormat('ru-RU',{minimumFractionDigits:2,maximumFractionDigits:2}).format(Number(v||0))+' BYN';const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function groups(m){return(m.categories||[]).map(c=>({c,items:(m.products||[]).filter(p=>String(p.category_id)===String(c.id))})).filter(x=>x.items.length)}
function sec(x,idx){return'<section class="category"><div class="category-index">'+String(idx+1).padStart(2,'0')+' / CATEGORY</div><h2>'+esc(x.c.name)+'</h2>'+x.items.map(p=>'<div class="item"><div class="line"><span class="name">'+esc(p.name)+'</span><span class="dots"></span><span class="price">'+money(p.price)+'</span></div>'+(p.description?'<div class="desc">'+esc(p.description)+'</div>':'')+'</div>').join('')+'</section>'}
function paginate(gs){const pages=[];let b=[],w=0;gs.forEach(g=>{const x=5+g.items.reduce((n,p)=>n+2+(p.description?1.25:0),0);if(b.length&&w+x>47){pages.push(b);b=[];w=0}b.push(g);w+=x});if(b.length)pages.push(b);return pages}
function render(){if(!menuData)return;const pages=paginate(groups(menuData));let categoryOffset=0;document.getElementById('preview').innerHTML=pages.map((p,i)=>{const sections=p.map((x,j)=>sec(x,categoryOffset+j)).join('');categoryOffset+=p.length;return'<article class="page '+current+(i===0?' first':'')+'"><div class="continuation">ПРОЕКТ · МЕНЮ</div>'+(i===0?'<header class="mast"><div class="title">МЕНЮ</div><div class="project">ПРОЕКТ</div></header>':'')+'<div class="columns">'+sections+'</div><footer class="foot"><span>'+(i===0?'МЕНЮ · ПРОЕКТ':'ПРОЕКТ · ПРОДОЛЖЕНИЕ')+'</span><span>'+(i+1)+' / '+pages.length+'</span></footer></article>'}).join('')}
document.querySelectorAll('[data-style]').forEach(b=>b.onclick=()=>{current=b.dataset.style;document.querySelectorAll('[data-style]').forEach(x=>x.classList.toggle('active',x===b));render()});
fetch('/api/menu',{headers:{Accept:'application/json'}}).then(r=>{if(!r.ok)throw 0;return r.json()}).then(x=>{menuData=x;render()}).catch(()=>document.getElementById('preview').innerHTML='<div class="loading">Не удалось загрузить меню.</div>');
</script></body></html>
