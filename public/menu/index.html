<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#08090b">
<title>Меню — Прилавок</title>
<style>
:root{--bg:#08090b;--panel:#101216;--panel2:#15181d;--text:#f7f7f4;--muted:#92979f;--line:rgba(255,255,255,.09);--glass:rgba(14,16,20,.78);--radius:28px}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",sans-serif;-webkit-font-smoothing:antialiased}
body:before{content:"";position:fixed;inset:-20%;pointer-events:none;background:radial-gradient(circle at 20% 0%,rgba(110,130,255,.12),transparent 28%),radial-gradient(circle at 85% 18%,rgba(255,255,255,.07),transparent 24%);z-index:-1}
button,a{font:inherit}html,body{overscroll-behavior-x:none}body{touch-action:pan-y}.shell{max-width:1320px;margin:auto;padding:0 24px 80px}.top{position:relative;z-index:20;margin:0 -24px;padding:14px 24px;background:linear-gradient(to bottom,rgba(8,9,11,.94),rgba(8,9,11,.76));backdrop-filter:blur(22px);-webkit-backdrop-filter:blur(22px);border-bottom:1px solid transparent}
.topin{max-width:1272px;margin:auto;display:flex;align-items:center;justify-content:space-between;gap:16px}.brand{font-size:14px;font-weight:760;letter-spacing:.16em;text-transform:uppercase}.nav{display:flex;align-items:center;gap:5px;padding:4px;background:rgba(255,255,255,.055);border:1px solid var(--line);border-radius:999px}.nav a{text-decoration:none;color:var(--muted);padding:9px 15px;border-radius:999px;font-size:14px;font-weight:650}.nav a.active{background:#f5f5f2;color:#0b0c0e}
.hero{padding:70px 0 38px;display:block}.eyebrow{color:#8d93a0;font-size:12px;letter-spacing:.18em;text-transform:uppercase;margin-bottom:14px}.hero h1{font-size:clamp(48px,8vw,104px);letter-spacing:-.065em;line-height:.86;margin:0;font-weight:760}.hero p{max-width:430px;color:var(--muted);font-size:17px;line-height:1.55;margin:0 0 5px}
.categories{position:sticky;top:0;z-index:15;display:flex;gap:8px;overflow:auto;padding:10px 0 14px;margin:0 0 16px;background:transparent;scrollbar-width:none;isolation:isolate}.categories:before{display:none}.categories::-webkit-scrollbar{display:none}.cat{border:1px solid rgba(255,255,255,.14);background:rgba(255,255,255,.075);color:rgba(255,255,255,.78);padding:11px 17px;min-height:42px;border-radius:999px;white-space:nowrap;cursor:pointer;transition:background .2s,border-color .2s,color .2s,transform .2s;display:flex;align-items:center;justify-content:center;flex:1 0 auto;backdrop-filter:blur(16px) saturate(125%);-webkit-backdrop-filter:blur(16px) saturate(125%);box-shadow:inset 0 1px 0 rgba(255,255,255,.08),0 6px 22px rgba(0,0,0,.12)}.cat:hover{background:rgba(255,255,255,.12);border-color:rgba(255,255,255,.24);color:#fff}.cat.active{background:rgba(255,255,255,.2);color:#fff;border-color:rgba(255,255,255,.34);backdrop-filter:blur(20px) saturate(140%);-webkit-backdrop-filter:blur(20px) saturate(140%);box-shadow:inset 0 1px 0 rgba(255,255,255,.16),0 8px 28px rgba(0,0,0,.16)}
.grid{display:grid;transition:opacity .18s ease,transform .24s cubic-bezier(.2,.8,.2,1);will-change:transform,opacity}.grid.swipe-out-left{opacity:.18;transform:translateX(-28px)}.grid.swipe-out-right{opacity:.18;transform:translateX(28px)}.grid.swipe-in-left{animation:slideInLeft .28s cubic-bezier(.2,.8,.2,1)}.grid.swipe-in-right{animation:slideInRight .28s cubic-bezier(.2,.8,.2,1)}
@keyframes slideInLeft{from{opacity:.15;transform:translateX(34px)}to{opacity:1;transform:translateX(0)}}@keyframes slideInRight{from{opacity:.15;transform:translateX(-34px)}to{opacity:1;transform:translateX(0)}}
.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}.product{position:relative;cursor:pointer;min-width:0;background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;animation:rise .5s both;transition:transform .3s cubic-bezier(.2,.8,.2,1),border-color .3s,box-shadow .3s}.product:hover{transform:translateY(-5px);border-color:rgba(255,255,255,.16);box-shadow:0 24px 60px rgba(0,0,0,.28)}.image{aspect-ratio:1.08/1;background:linear-gradient(135deg,#171a20,#0f1115);overflow:hidden;display:grid;place-items:center}.image img{width:100%;height:100%;object-fit:cover;transition:transform .65s cubic-bezier(.2,.8,.2,1)}.product:hover img{transform:scale(1.035)}.placeholder{font-size:56px;filter:grayscale(1);opacity:.25}.info{padding:18px 19px 20px}.name{font-size:19px;line-height:1.2;font-weight:690;letter-spacing:-.02em}.desc{color:var(--muted);font-size:13px;line-height:1.45;margin-top:8px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:0}.price{font-size:17px;font-weight:720;margin-top:16px}.empty,.loading{grid-column:1/-1;padding:70px 20px;text-align:center;color:var(--muted);border:1px solid var(--line);border-radius:var(--radius);background:var(--panel)}
.footer{display:flex;justify-content:space-between;gap:20px;color:#626770;font-size:12px;padding:44px 2px 0}.footer a{color:#aeb2b9;text-decoration:none}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}@media(max-width:900px){.hero{grid-template-columns:1fr;padding-top:48px}.hero p{max-width:600px}.grid{grid-template-columns:repeat(2,minmax(0,1fr))}}@media(max-width:560px){.shell{padding:0 14px 56px}.top{margin:0 -14px;padding:11px 14px}.brand{font-size:12px}.nav a{padding:8px 12px;font-size:13px}.hero{padding:38px 2px 26px;gap:18px}.hero h1{font-size:56px}.hero p{font-size:15px}.categories{top:0;padding-top:8px}.grid{gap:10px}.product{border-radius:20px}.info{padding:13px 13px 15px}.name{font-size:16px}.desc{font-size:12px}.price{font-size:15px;margin-top:12px}.footer{flex-direction:column}.image{aspect-ratio:1/1.04}}@media(max-width:370px){.grid{grid-template-columns:1fr}.image{aspect-ratio:1.25/1}.hero h1{font-size:48px}.nav a{padding:7px 9px}.brand{letter-spacing:.1em}}
@media(min-width:1400px){.shell{max-width:1480px}.topin{max-width:1432px}.grid{grid-template-columns:repeat(4,minmax(0,1fr))}}
@media(hover:none){.product:hover{transform:none;box-shadow:none}.product:hover img{transform:none}}@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important;scroll-behavior:auto!important}}
.modal{position:fixed;inset:0;z-index:50;display:none;align-items:center;justify-content:center;padding:24px;background:rgba(0,0,0,.72);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}.modal.open{display:flex}.modal-card{width:min(560px,100%);max-height:90vh;overflow:auto;background:#111318;border:1px solid rgba(255,255,255,.12);border-radius:30px;box-shadow:0 30px 100px rgba(0,0,0,.55);position:relative}.modal-image{aspect-ratio:1.15/1;background:#171a20;overflow:hidden}.modal-image img{width:100%;height:100%;object-fit:cover}.modal-body{padding:22px 24px 26px}.modal-name{font-size:28px;font-weight:740;letter-spacing:-.035em}.modal-desc{color:var(--muted);font-size:15px;line-height:1.55;margin-top:10px}.modal-price{font-size:20px;font-weight:750;margin-top:20px}.modal-close{position:absolute;right:14px;top:14px;width:40px;height:40px;border:1px solid rgba(255,255,255,.14);border-radius:50%;background:rgba(8,9,11,.72);color:white;font-size:22px;cursor:pointer;backdrop-filter:blur(10px)}@media(max-width:560px){.modal{padding:12px}.modal-card{border-radius:24px}.modal-body{padding:18px}.modal-name{font-size:24px}}
.food-bg{position:fixed;inset:0;z-index:-1;overflow:hidden;pointer-events:none;opacity:.9;filter:saturate(.92)}.food{position:absolute;display:block;will-change:transform;user-select:none;transform-origin:center;contain:layout paint}.food-tomato{--s:clamp(112px,12vw,190px);width:var(--s);height:calc(var(--s)*.94);border-radius:48% 52% 51% 49% / 46% 47% 53% 54%;background:radial-gradient(ellipse at 31% 23%,rgba(255,226,190,.8) 0 2%,rgba(255,155,118,.42) 3%,transparent 10%),radial-gradient(ellipse at 68% 72%,rgba(88,10,8,.42),transparent 38%),radial-gradient(circle at 45% 38%,#ef6248 0 22%,#cf382b 53%,#8d211c 78%,#5a1715 100%);box-shadow:inset 10px 8px 20px rgba(255,187,142,.14),inset -22px -25px 34px rgba(50,5,4,.38),0 30px 80px rgba(0,0,0,.34);opacity:.76}.food-tomato:before{content:"";position:absolute;left:37%;top:-8%;width:28%;height:25%;background:#456b38;clip-path:polygon(48% 42%,5% 3%,32% 49%,0 72%,40% 62%,46% 100%,57% 62%,100% 78%,69% 49%,94% 7%);filter:drop-shadow(0 5px 3px rgba(0,0,0,.3));transform:rotate(-7deg)}.food-tomato:after{content:"";position:absolute;inset:6%;border-radius:inherit;background:radial-gradient(circle at 24% 31%,rgba(255,255,255,.24) 0 1%,transparent 2%),radial-gradient(circle at 72% 38%,rgba(255,198,158,.09) 0 1%,transparent 2%);background-size:31px 29px,23px 27px;mix-blend-mode:screen;opacity:.55}
.food-leaf{--s:clamp(150px,18vw,280px);width:var(--s);height:calc(var(--s)*.72);opacity:.55;filter:drop-shadow(0 25px 34px rgba(0,0,0,.28))}.food-leaf:before,.food-leaf:after{content:"";position:absolute;inset:0;background:radial-gradient(ellipse at 28% 55%,#557448 0 16%,transparent 17%),radial-gradient(ellipse at 49% 31%,#6f8c59 0 17%,transparent 18%),radial-gradient(ellipse at 70% 54%,#45683f 0 17%,transparent 18%),radial-gradient(ellipse at 48% 72%,#789462 0 16%,transparent 17%)}.food-leaf:after{inset:45% 8% auto 43%;width:52%;height:4%;background:#678052;border-radius:99px;transform:rotate(14deg);transform-origin:left center}.food-ring{width:clamp(135px,15vw,220px);height:clamp(135px,15vw,220px);border:13px solid rgba(174,50,36,.16);border-radius:44% 56% 49% 51%;filter:blur(.2px);opacity:.38}.food-herb{--s:clamp(130px,16vw,245px);width:var(--s);height:var(--s);opacity:.34}.food-herb:before{content:"";position:absolute;left:48%;top:5%;width:3%;height:88%;background:#526d48;border-radius:99px;transform:rotate(28deg)}.food-herb:after{content:"";position:absolute;inset:8%;background:radial-gradient(ellipse at 32% 25%,#678158 0 8%,transparent 9%),radial-gradient(ellipse at 61% 38%,#486a45 0 9%,transparent 10%),radial-gradient(ellipse at 33% 52%,#759064 0 9%,transparent 10%),radial-gradient(ellipse at 66% 66%,#55774d 0 9%,transparent 10%),radial-gradient(ellipse at 39% 79%,#668557 0 8%,transparent 9%)}.t1{left:-5%;top:8%}.l1{right:-7%;top:17%}.t2{right:2%;top:50%;scale:.78}.l2{left:-7%;top:58%;rotate:-24deg}.t3{left:6%;top:80%;scale:.66}.l3{right:7%;top:76%;scale:.78;rotate:32deg}.t4{right:30%;top:5%;scale:.48}.l4{left:29%;top:38%;scale:.58;opacity:.34}.r1{left:18%;top:29%}.r2{right:17%;top:69%;scale:.72}.h1{right:30%;top:31%;rotate:18deg}.h2{left:36%;top:70%;scale:.72;rotate:-20deg}
@media(max-width:560px){.food-bg{opacity:.76}.food-tomato{--s:92px}.food-leaf{--s:145px}.food-ring{width:110px;height:110px;border-width:9px}.food-herb{--s:140px}.t1{left:-30px}.l1{right:-48px}.t2{right:-26px}.l2{left:-48px}.t4{right:16%;top:10%}.l4{left:20%;top:42%}.r1{left:2%;top:34%}.h1{right:3%}}@media(prefers-reduced-motion:reduce){.food-bg{display:none}}
</style>
</head>
<body>
<div class="food-bg" aria-hidden="true">
  <span class="food food-tomato t1"></span><span class="food food-leaf l1"></span>
  <span class="food food-tomato t2"></span><span class="food food-leaf l2"></span>
  <span class="food food-tomato t3"></span><span class="food food-leaf l3"></span>
  <span class="food food-tomato t4"></span><span class="food food-leaf l4"></span>
  <span class="food food-ring r1"></span><span class="food food-ring r2"></span>
  <span class="food food-herb h1"></span><span class="food food-herb h2"></span>
</div>
<div class="shell">
<header class="top"><div class="topin"><div class="brand">Проект</div><nav class="nav" aria-label="Разделы"><a class="active" href="/menu/">Меню</a><a href="/">Онлайн заказ</a></nav></div></header>
<section class="hero"><div><h1>Меню</h1></div></section>
<div id="categories" class="categories" aria-label="Категории"></div>
<main id="grid" class="grid"><div class="loading">Загружаем меню…</div></main>

</div>
<div id="productModal" class="modal" role="dialog" aria-modal="true" aria-hidden="true"><div class="modal-card"><button class="modal-close" aria-label="Закрыть">×</button><div id="modalContent"></div></div></div>
<script>
const state={menu:{categories:[],products:[]},active:null};
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const attr=esc;
const money=n=>Number(n||0).toLocaleString('ru-RU',{minimumFractionDigits:2,maximumFractionDigits:2})+' BYN';
function orderedCategories(){const priority=['пицца','горячее','салаты','закуски','сеты','десерты','холодные напитки','горячие напитки'];return [...state.menu.categories].sort((a,b)=>{const ai=priority.indexOf(String(a.name||'').trim().toLocaleLowerCase('ru-RU')),bi=priority.indexOf(String(b.name||'').trim().toLocaleLowerCase('ru-RU'));if(ai>=0&&bi>=0)return ai-bi;if(ai>=0)return-1;if(bi>=0)return 1;return Number(a.sort_order||0)-Number(b.sort_order||0)})}
let categoryAnimating=false;function switchCategory(direction){const cats=orderedCategories();if(!cats.length||categoryAnimating)return;const index=Math.max(0,cats.findIndex(c=>String(c.id)===String(state.active)));const next=index+direction;if(next<0||next>=cats.length)return;categoryAnimating=true;const grid=document.getElementById('grid');grid.classList.add(direction>0?'swipe-out-left':'swipe-out-right');setTimeout(()=>{state.active=cats[next].id;renderCategories();renderProducts();grid.classList.remove('swipe-out-left','swipe-out-right');grid.classList.add(direction>0?'swipe-in-left':'swipe-in-right');const active=document.querySelector('.cat.active');active?.scrollIntoView({behavior:'smooth',block:'nearest',inline:'center'});setTimeout(()=>{grid.classList.remove('swipe-in-left','swipe-in-right');categoryAnimating=false},300)},180)}
function renderCategories(){const cats=orderedCategories();if(!state.active||!cats.some(c=>c.id===state.active))state.active=cats[0]?.id||null;document.getElementById('categories').innerHTML=cats.map(c=>'<button class="cat '+(c.id===state.active?'active':'')+'" data-id="'+attr(c.id)+'">'+esc(c.name)+'</button>').join('');document.querySelectorAll('.cat').forEach(b=>b.addEventListener('click',()=>{state.active=b.dataset.id;renderCategories();renderProducts()}))}
function openProduct(p){const modal=document.getElementById('productModal');document.getElementById('modalContent').innerHTML=(p.image_url?'<div class="modal-image"><img src="'+attr(p.image_url)+'" alt="'+attr(p.name)+'"></div>':'')+'<div class="modal-body"><div class="modal-name">'+esc(p.name)+'</div>'+(p.description?'<div class="modal-desc">'+esc(p.description)+'</div>':'')+'<div class="modal-price">'+money(p.price)+'</div></div>';modal.classList.add('open');modal.setAttribute('aria-hidden','false');document.body.style.overflow='hidden'}
function closeProduct(){const modal=document.getElementById('productModal');modal.classList.remove('open');modal.setAttribute('aria-hidden','true');document.body.style.overflow=''}
function renderProducts(){const items=state.active?state.menu.products.filter(p=>String(p.category_id)===String(state.active)):state.menu.products;const grid=document.getElementById('grid');if(!items.length){grid.innerHTML='<div class="empty">В этой категории пока нет товаров.</div>';return}grid.innerHTML=items.map((p,i)=>'<article tabindex="0" role="button" data-product="'+attr(p.id)+'" class="product" style="animation-delay:'+Math.min(i*35,280)+'ms"><div class="image">'+(p.image_url?'<img src="'+attr(p.image_url)+'" alt="'+attr(p.name)+'" loading="lazy">':'<div class="placeholder">◌</div>')+'</div><div class="info"><div class="name">'+esc(p.name)+'</div>'+(p.description?'<div class="desc">'+esc(p.description)+'</div>':'')+'<div class="price">'+money(p.price)+'</div></div></article>').join('');grid.querySelectorAll('.product').forEach(card=>{const p=items.find(x=>String(x.id)===String(card.dataset.product));card.addEventListener('click',()=>openProduct(p));card.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();openProduct(p)}})})}
async function load(){try{const r=await fetch('/api/menu',{headers:{Accept:'application/json'}});if(!r.ok)throw new Error();state.menu=await r.json();renderCategories();renderProducts()}catch(e){document.getElementById('categories').innerHTML='';document.getElementById('grid').innerHTML='<div class="empty">Не удалось загрузить меню.<br>Попробуйте обновить страницу.</div>'}}
let touchStartX=0,touchStartY=0,touchStartedAt=0;const swipeArea=document.querySelector('.shell');swipeArea.addEventListener('touchstart',e=>{if(document.getElementById('productModal').classList.contains('open'))return;const t=e.changedTouches[0];touchStartX=t.clientX;touchStartY=t.clientY;touchStartedAt=Date.now();if(touchStartX<24||touchStartX>window.innerWidth-24)touchStartedAt=0},{passive:true});swipeArea.addEventListener('touchend',e=>{if(document.getElementById('productModal').classList.contains('open'))return;const t=e.changedTouches[0],dx=t.clientX-touchStartX,dy=t.clientY-touchStartY;if(touchStartedAt&&Date.now()-touchStartedAt<700&&Math.abs(dx)>70&&Math.abs(dx)>Math.abs(dy)*1.5)switchCategory(dx<0?1:-1)},{passive:true});
const foodItems=[...document.querySelectorAll('.food')];let bgTick=false;function animateFood(){if(bgTick)return;bgTick=true;requestAnimationFrame(()=>{const y=window.scrollY;foodItems.forEach((el,i)=>{const foreground=i%3===0;const speed=foreground?.065:.028;const x=Math.sin(y*.0014+i*1.73)*(foreground?16:9);const yy=y*speed;const rot=Math.sin(y*.0008+i)* (foreground?7:3);el.style.transform='translate3d('+x+'px,'+yy+'px,0) rotate('+rot+'deg)'});bgTick=false})}window.addEventListener('scroll',animateFood,{passive:true});animateFood();
document.querySelector('.modal-close').addEventListener('click',closeProduct);document.getElementById('productModal').addEventListener('click',e=>{if(e.target.id==='productModal')closeProduct()});document.addEventListener('keydown',e=>{if(e.key==='Escape')closeProduct()});
load();
</script>
</body>
</html>
