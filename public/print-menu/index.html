<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Проект — Print Studio</title><style>
*{box-sizing:border-box}html{background:#151614}body{margin:0;color:#ecebe5;font-family:"Trebuchet MS",sans-serif}.toolbar{position:sticky;top:0;z-index:30;background:#151614f2;border-bottom:1px solid #ffffff14;backdrop-filter:blur(16px);padding:12px 16px}.bar{max-width:1180px;margin:auto;display:flex;align-items:center;gap:18px}.brand{font:700 13px Georgia,serif;letter-spacing:.08em;white-space:nowrap}.styles{display:flex;gap:4px;overflow:auto;flex:1;padding:3px}.styles button,.action{border:1px solid transparent;background:transparent;color:#aaa;padding:9px 12px;border-radius:7px;white-space:nowrap;font:700 12px "Trebuchet MS",sans-serif;cursor:pointer}.styles button.active{background:#ecebe5;color:#171815}.action{background:#ecebe5;color:#171815}.preview{padding:30px 12px}.page{width:210mm;min-height:297mm;margin:0 auto 28px;position:relative;overflow:hidden;box-shadow:0 22px 70px #0009;page-break-after:always}.page:last-child{page-break-after:auto}.mast{position:relative}.only-first{display:none}.first .only-first{display:block}.cat{break-inside:avoid}.item{break-inside:avoid}.row{display:flex;align-items:baseline;gap:2mm}.name{font-weight:700}.leader{flex:1;border-bottom:1px dotted currentColor;opacity:.25}.price{white-space:nowrap;font-variant-numeric:tabular-nums}.desc{opacity:.68}.folio{position:absolute;font-size:7pt}.loading{text-align:center;padding:80px;color:#999}

/* 01 FIELD — Swiss field guide: strict 12-column logic, no cards */
.field{background:#f1efe7;color:#173d34;padding:13mm 14mm 12mm;font-family:"Trebuchet MS",sans-serif}.field .mast{height:54mm;border-top:2.5mm solid #173d34;padding-top:4mm;display:grid;grid-template-columns:2fr 1fr}.field .hero{font:400 62pt/0.82 Georgia,serif;letter-spacing:-.07em}.field .meta{text-align:right;font-size:6.5pt;letter-spacing:.18em;line-height:1.8}.field .content{display:grid;grid-template-columns:1fr 1fr;gap:0 13mm}.field .cat{padding:7mm 0 5mm;border-top:.3mm solid #173d34}.field .cat:nth-child(3n){grid-column:1/-1;display:grid;grid-template-columns:1fr 2fr;gap:8mm}.field .kicker{font-size:6pt;letter-spacing:.2em;margin-bottom:2mm}.field h2{font:400 19pt/1 Georgia,serif;letter-spacing:-.03em;margin:0 0 4mm}.field .item{margin:0 0 3.2mm}.field .name,.field .price{font-size:8.5pt}.field .desc{font-size:6.7pt;line-height:1.35;margin-top:.8mm}.field .folio{bottom:6mm;right:14mm}

/* 02 LEDGER — dense newspaper / culinary journal */
.ledger{background:#f5e8c9;color:#282018;padding:10mm 12mm 11mm;font-family:Georgia,serif;border-top:6mm solid #9f3025}.ledger .mast{height:47mm;border-bottom:1mm double #282018;text-align:center;padding-top:2mm}.ledger .eyebrow{font:700 6pt "Trebuchet MS";letter-spacing:.35em}.ledger .hero{font:700 49pt/.95 Georgia,serif}.ledger .strap{font-size:7pt;font-style:italic}.ledger .content{column-count:3;column-gap:6mm;column-rule:.2mm solid #28201855;padding-top:5mm}.ledger .cat{margin:0 0 7mm}.ledger .kicker{font:700 6pt "Trebuchet MS";letter-spacing:.14em;border-bottom:.5mm solid currentColor;padding-bottom:1mm}.ledger h2{font:700 14pt/1.05 Georgia,serif;margin:2mm 0 3mm}.ledger .item{margin-bottom:2.7mm}.ledger .name,.ledger .price{font-size:7.7pt}.ledger .desc{font-size:6.4pt;line-height:1.25;margin-top:.7mm;font-style:italic}.ledger .folio{bottom:5mm;left:12mm}

/* 03 BLOCKS — playful modular cafe system */
.blocks{background:#efe8da;color:#19221d;padding:11mm;font-family:"Trebuchet MS",sans-serif}.blocks .mast{height:56mm;display:grid;grid-template-columns:1.4fr .6fr;gap:4mm}.blocks .hero{background:#ee593f;color:#18211c;padding:5mm;font:900 49pt/.8 Impact,"Arial Black",sans-serif;letter-spacing:-.02em}.blocks .meta{background:#173e34;color:#efe8da;padding:5mm;display:flex;align-items:flex-end;font-size:8pt;font-weight:700}.blocks .content{display:grid;grid-template-columns:repeat(2,1fr);gap:4mm}.blocks .cat{padding:5mm;background:#ded7c9;min-height:38mm}.blocks .cat:nth-child(5n+1){background:#173e34;color:#efe8da}.blocks .cat:nth-child(5n+2){background:#f0c84b}.blocks .cat:nth-child(4n){grid-column:1/-1;display:grid;grid-template-columns:.75fr 1.25fr;gap:5mm}.blocks .kicker{font-size:6pt;font-weight:900;letter-spacing:.15em}.blocks h2{font:900 17pt/1 Impact,"Arial Black",sans-serif;text-transform:uppercase;margin:2mm 0 4mm;letter-spacing:.02em}.blocks .item{margin-bottom:2.5mm}.blocks .name,.blocks .price{font-size:8pt}.blocks .desc{font-size:6.4pt;line-height:1.25;margin-top:.7mm}.blocks .folio{right:11mm;bottom:5mm}

/* 04 POSTER — radical typographic night poster */
.poster{background:#171713;color:#eee5d2;padding:10mm 11mm 11mm;font-family:"Arial Narrow","Trebuchet MS",sans-serif}.poster .mast{height:62mm;border-bottom:1px solid #eee5d255}.poster .hero{font:900 82pt/.68 Impact,"Arial Black",sans-serif;letter-spacing:-.01em}.poster .meta{position:absolute;right:0;bottom:5mm;background:#e54c34;color:#171713;padding:2.5mm 5mm;font-size:7pt;font-weight:900;letter-spacing:.18em}.poster .content{display:grid;grid-template-columns:1fr 1fr;gap:0 7mm}.poster .cat{padding:6mm 0;border-bottom:1px solid #eee5d233}.poster .cat:nth-child(4n+1){grid-column:1/-1;background:#e54c34;color:#171713;margin:0 -11mm;padding:6mm 11mm;display:grid;grid-template-columns:.65fr 1.35fr;gap:7mm}.poster .cat:nth-child(4n+3){border-left:4mm solid #e54c34;padding-left:5mm}.poster .kicker{font-size:6pt;font-weight:900;letter-spacing:.2em}.poster h2{font:400 22pt/.9 Impact,"Arial Black",sans-serif;text-transform:uppercase;margin:2mm 0 5mm}.poster .item{margin-bottom:2.8mm}.poster .name,.poster .price{font-size:8.3pt}.poster .desc{font-size:6.5pt;line-height:1.3;margin-top:.7mm}.poster .folio{right:11mm;bottom:5mm;color:#e54c34}

/* 05 TABLE — elegant restaurant list, one flowing spine */
.tablemenu{background:#e8ece4;color:#23362e;padding:14mm 17mm 12mm;font-family:Georgia,serif}.tablemenu .mast{height:51mm;display:flex;justify-content:space-between;border-bottom:.25mm solid #23362e;padding-bottom:6mm}.tablemenu .hero{font:italic 46pt/.9 Georgia,serif;align-self:flex-end}.tablemenu .seal{width:26mm;height:26mm;border:1px solid #23362e;border-radius:50%;display:grid;place-items:center;text-align:center;font:700 6pt "Trebuchet MS";letter-spacing:.12em;transform:rotate(7deg)}.tablemenu .content{max-width:154mm;margin:8mm auto 0}.tablemenu .cat{display:grid;grid-template-columns:38mm 1fr;gap:8mm;padding:5mm 0;border-bottom:.2mm solid #23362e55}.tablemenu .kicker{font:700 6pt "Trebuchet MS";letter-spacing:.16em}.tablemenu h2{font:italic 16pt/1 Georgia,serif;margin:1mm 0}.tablemenu .item{margin-bottom:3mm}.tablemenu .name{font-size:9pt;font-weight:400}.tablemenu .price{font:700 8pt "Trebuchet MS"}.tablemenu .leader{border:0}.tablemenu .desc{font-size:6.8pt;line-height:1.35;margin-top:.7mm}.tablemenu .folio{left:17mm;bottom:6mm}
.page:not(.first) .mast{display:none}.page:not(.first){padding-top:14mm}.page:not(.first) .content{margin-top:0}.page:not(.first):before{content:"ПРОЕКТ · МЕНЮ";position:absolute;top:6mm;left:inherit;font-size:6pt;letter-spacing:.18em;opacity:.45}
@page{size:A4 portrait;margin:0}@media print{html,body{background:white}.toolbar{display:none}.preview{padding:0}.page{margin:0;box-shadow:none}}@media(max-width:860px){.bar{align-items:flex-start;flex-direction:column}.styles{width:100%}.preview{overflow:auto;padding:12px}.toolbar{position:relative}}
</style></head><body><header class="toolbar"><div class="bar"><div class="brand">ПРОЕКТ · PRINT STUDIO</div><div class="styles"><button data-style="field" class="active">01 Field</button><button data-style="ledger">02 Ledger</button><button data-style="blocks">03 Blocks</button><button data-style="poster">04 Poster</button><button data-style="tablemenu">05 Table</button></div><button class="action" onclick="window.print()">PDF / Печать</button></div></header><main class="preview" id="preview"><div class="loading">Загружаем актуальное меню…</div></main>
<script>
let menuData=null,current='field';const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const money=v=>new Intl.NumberFormat('ru-RU',{minimumFractionDigits:2,maximumFractionDigits:2}).format(Number(v||0))+' BYN';
function groups(m){return(m.categories||[]).map(c=>({c,items:(m.products||[]).filter(p=>String(p.category_id)===String(c.id))})).filter(x=>x.items.length)}
function items(g){return g.items.map(p=>'<div class="item"><div class="row"><span class="name">'+esc(p.name)+'</span><span class="leader"></span><span class="price">'+money(p.price)+'</span></div>'+(p.description?'<div class="desc">'+esc(p.description)+'</div>':'')+'</div>').join('')}
function section(g,n){return'<section class="cat"><div class="cathead"><div class="kicker">'+String(n+1).padStart(2,'0')+' · ПРОЕКТ</div><h2>'+esc(g.c.name)+'</h2></div><div class="products">'+items(g)+'</div></section>'}
function limit(){return current==='ledger'?58:current==='tablemenu'?42:current==='poster'?44:current==='blocks'?43:46}
function weight(g){return 5+g.items.reduce((a,p)=>a+1.7+(p.description?1.05:0),0)}
function paginate(gs){let pages=[],p=[],w=0,L=limit();for(const g of gs){let x=weight(g);if(p.length&&w+x>L){pages.push(p);p=[];w=0}p.push(g);w+=x}if(p.length)pages.push(p);return pages}
function mast(){if(current==='ledger')return'<header class="mast"><div class="eyebrow">НЕБОЛЬШОЕ КАФЕ · БОЛЬШАЯ ЕДА</div><div class="hero">МЕНЮ</div><div class="strap">Проект · еда, кофе и хорошие дни</div></header>';if(current==='blocks')return'<header class="mast"><div class="hero">МЕНЮ</div><div class="meta">ПРОЕКТ<br>ЕСТЬ. ПИТЬ.<br>ВСТРЕЧАТЬСЯ.</div></header>';if(current==='poster')return'<header class="mast"><div class="hero">MENU</div><div class="meta">ПРОЕКТ / DUBROVNO</div></header>';if(current==='tablemenu')return'<header class="mast"><div class="hero">Меню</div><div class="seal">ПРОЕКТ<br>CAFÉ</div></header>';return'<header class="mast"><div class="hero">Меню</div><div class="meta">ПРОЕКТ<br>КАФЕ · ДУБРОВНО<br>FOOD / COFFEE / PEOPLE</div></header>'}
function render(){if(!menuData)return;let offset=0,pages=paginate(groups(menuData));document.getElementById('preview').innerHTML=pages.map((pg,i)=>{let body=pg.map((g,j)=>section(g,offset+j)).join('');offset+=pg.length;return'<article class="page '+current+(i===0?' first':'')+'>'+(i===0?mast():'')+'<div class="content">'+body+'</div><div class="folio">'+String(i+1).padStart(2,'0')+' / '+String(pages.length).padStart(2,'0')+'</div></article>'}).join('')}
document.querySelectorAll('[data-style]').forEach(b=>b.onclick=()=>{current=b.dataset.style;document.querySelectorAll('[data-style]').forEach(x=>x.classList.toggle('active',x===b));render()});
fetch('/api/menu',{headers:{Accept:'application/json'}}).then(r=>{if(!r.ok)throw Error();return r.json()}).then(x=>{menuData=x;render()}).catch(()=>document.getElementById('preview').innerHTML='<div class="loading">Не удалось загрузить меню.</div>');
</script></body></html>
