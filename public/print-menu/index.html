<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Проект — печатное меню</title>
<style>
:root{--ink:#064f3c;--paper:#f5f0df;--muted:#5e7068}*{box-sizing:border-box}body{margin:0;background:#181a1a;font-family:Arial,Helvetica,sans-serif;color:var(--ink)}
.toolbar{position:sticky;top:0;z-index:10;display:flex;align-items:center;justify-content:space-between;gap:16px;padding:14px 20px;background:rgba(20,22,22,.94);color:white;backdrop-filter:blur(16px)}.toolbar strong{font-size:14px}.actions{display:flex;gap:8px}.actions button{border:1px solid #ffffff28;background:#ffffff12;color:#fff;border-radius:999px;padding:10px 16px;cursor:pointer}.actions .primary{background:#fff;color:#111}
.preview{padding:32px}.page{width:210mm;min-height:297mm;margin:0 auto 32px;background:var(--paper);padding:16mm 16mm 14mm;box-shadow:0 18px 60px #0008;position:relative;overflow:hidden}.mast{display:flex;justify-content:space-between;align-items:flex-end;border-bottom:1.5px solid var(--ink);padding-bottom:6mm;margin-bottom:8mm}.title{font-size:54pt;font-weight:900;letter-spacing:-.065em;line-height:.8}.brand{font-size:15pt;font-weight:700}.columns{column-count:2;column-gap:13mm}.category{break-inside:avoid;margin:0 0 9mm}.category h2{font-size:15pt;line-height:1;margin:0 0 4mm;padding-bottom:2mm;border-bottom:1px solid #0b5b4640;text-transform:uppercase;letter-spacing:.01em}.item{break-inside:avoid;margin:0 0 3.3mm}.line{display:grid;grid-template-columns:auto 1fr auto;align-items:end;gap:2mm}.name{font-size:10.5pt;font-weight:750}.dots{border-bottom:1px dotted #315e51;transform:translateY(-2px);opacity:.55}.price{font-size:10.5pt;font-weight:800}.desc{font-size:7.5pt;line-height:1.3;color:var(--muted);margin-top:1mm;max-width:92%}.foot{position:absolute;left:16mm;right:16mm;bottom:8mm;border-top:1px solid #0b5b4640;padding-top:3mm;font-size:6.8pt;display:flex;justify-content:space-between;color:var(--muted)}
.loading{text-align:center;padding:80px;color:#aaa}@page{size:A4 portrait;margin:0}@media print{body{background:white}.toolbar{display:none}.preview{padding:0}.page{margin:0;box-shadow:none;page-break-after:always}.page:last-child{page-break-after:auto}}@media(max-width:850px){.preview{padding:12px;overflow:auto}.page{transform-origin:top left}.toolbar{align-items:flex-start}.actions{flex-wrap:wrap;justify-content:flex-end}}
</style></head><body>
<div class="toolbar"><strong>Печатное меню · A4</strong><div class="actions"><button onclick="location.reload()">Обновить данные</button><button class="primary" onclick="window.print()">Скачать / печать PDF</button></div></div>
<main class="preview" id="preview"><div class="loading">Загружаем актуальное меню…</div></main>
<script>
const money=v=>new Intl.NumberFormat('ru-RU',{minimumFractionDigits:2,maximumFractionDigits:2}).format(Number(v||0))+' BYN';
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function group(menu){return (menu.categories||[]).map(c=>({c,items:(menu.products||[]).filter(p=>String(p.category_id)===String(c.id))})).filter(x=>x.items.length)}
function section(x){return '<section class="category"><h2>'+esc(x.c.name)+'</h2>'+x.items.map(p=>'<div class="item"><div class="line"><span class="name">'+esc(p.name)+'</span><span class="dots"></span><span class="price">'+money(p.price)+'</span></div>'+(p.description?'<div class="desc">'+esc(p.description)+'</div>':'')+'</div>').join('')+'</section>'}
function render(menu){const groups=group(menu),pages=[];let bucket=[],weight=0;for(const g of groups){const w=5+g.items.reduce((n,p)=>n+2+(p.description?1.3:0),0);if(bucket.length&&weight+w>47){pages.push(bucket);bucket=[];weight=0}bucket.push(g);weight+=w}if(bucket.length)pages.push(bucket);document.getElementById('preview').innerHTML=pages.map((p,i)=>'<article class="page"><header class="mast"><div class="title">МЕНЮ</div><div class="brand">ПРОЕКТ</div></header><div class="columns">'+p.map(section).join('')+'</div><footer class="foot"><span>Актуальные цены и ассортимент</span><span>'+(i+1)+' / '+pages.length+'</span></footer></article>').join('')}
fetch('/api/menu',{headers:{Accept:'application/json'}}).then(r=>{if(!r.ok)throw 0;return r.json()}).then(render).catch(()=>document.getElementById('preview').innerHTML='<div class="loading">Не удалось загрузить меню.</div>');
</script></body></html>
