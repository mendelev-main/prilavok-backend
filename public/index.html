<div id="productDetail" class="product-detail"><div class="detail-inner"><div class="detail-top"><button class="back-btn" onclick="closeProductDetail()">← Назад</button><div class="brand">Проект</div></div><div id="detailContent"></div></div></div>
<div id="cartbar" class="cartbar"><button class="cartbtn" onclick="openCart()"><span>Корзина · <span id="cartCount">0</span></span><span id="cartTotal">0,00 BYN</span></button></div>
<div id="cartModal" class="modal" onclick="if(event.target===this)closeCart()"><div class="sheet"><div class="handle"></div><h2>Ваш заказ</h2><div id="cartItems"></div><div class="section"><label>Способ получения</label><div class="switches"><button id="pickupBtn" class="switch active" onclick="setType('Самовывоз')">🏠 Самовывоз</button><button id="deliveryBtn" class="switch" onclick="setType('Доставка')">🚗 Доставка</button></div></div><div id="deliveryFields" class="section" style="display:none"><label>Данные для доставки</label><input id="name" class="field" placeholder="Имя"><div class="phone-field"><span class="phone-prefix">+375</span><input id="phone" type="tel" inputmode="tel" autocomplete="tel-national" aria-label="Телефон, код страны +375" placeholder="29 123 45 67" oninput="formatPhoneInput(this)"></div><input id="address" class="field" placeholder="Адрес доставки"><input id="comment" class="field" placeholder="Комментарий к заказу"><div class="muted" style="font-size:13px">Доставка: <span id="deliveryFeeText">0,00 BYN</span></div></div><div id="pickupFields" class="section"><label>Контактные данные</label><input id="namePickup" class="field" placeholder="Имя"><div class="phone-field"><span class="phone-prefix">+375</span><input id="phonePickup" type="tel" inputmode="tel" autocomplete="tel-national" aria-label="Телефон, код страны +375" placeholder="29 123 45 67" oninput="formatPhoneInput(this)"></div><input id="commentPickup" class="field" placeholder="Комментарий к заказу"></div><div class="total"><span>Итого</span><span id="checkoutTotal">0,00 BYN</span></div><button id="submitBtn" class="checkout" onclick="submitOrder()">Оформить заказ</button></div></div>
<div id="successModal" class="modal"><div class="sheet"><div class="success"><div class="icon">✓</div><h2>Заказ принят</h2><p class="muted">Ваш заказ создан. Ниже можно следить за его статусом.</p><button class="checkout" onclick="closeSuccessAndShowTracking()">Следить за заказом</button></div></div></div>
<div id="toast" class="toast"></div>
<script src="/order-validation.js"></script>
<script>
const API=location.origin;let menu={categories:[],products:[]};let cart=[];let activeCat=null;let orderType='Самовывоз';let trackingToken=localStorage.getItem('prilavok_tracking_token')||'';let trackingTimer=null;let trackingOrder=null;
const money=n=>Number(n||0).toLocaleString('ru-RU',{minimumFractionDigits:2,maximumFractionDigits:2})+' BYN';
async function loadMenu(){try{const r=await fetch(API+'/api/menu');if(!r.ok)throw 0;menu=await r.json();renderCats();renderProducts()}catch(e){document.getElementById('grid').innerHTML='<div class="empty" style="grid-column:1/-1">Не удалось загрузить меню.<br>Попробуйте обновить страницу.</div>'}}
function orderedCategories(){const priority=['пицца','горячее','салаты','закуски','сеты','десерты','холодные напитки','горячие напитки'];return [...menu.categories].sort((a,b)=>{const ai=priority.indexOf(String(a.name||'').trim().toLocaleLowerCase('ru-RU')),bi=priority.indexOf(String(b.name||'').trim().toLocaleLowerCase('ru-RU'));if(ai>=0&&bi>=0)return ai-bi;if(ai>=0)return-1;if(bi>=0)return 1;return 0})}
function renderCats(){const el=document.getElementById('cats'),cats=orderedCategories();if(!activeCat||!cats.some(c=>c.id===activeCat))activeCat=cats[0]?.id||null;el.innerHTML=cats.map(c=>`<button class="cat ${c.id===activeCat?'active':''}" data-cat="${c.id}" onclick="setCat('${c.id}')">${esc(c.name)}</button>`).join('')}
function setCat(id){activeCat=id;document.querySelectorAll('.cat').forEach(x=>x.classList.toggle('active',x.dataset.cat===id));renderProducts()}
function renderProducts(){const ps=activeCat?menu.products.filter(p=>p.category_id===activeCat):menu.products;const el=document.getElementById('grid');if(!ps.length){el.innerHTML='<div class="empty" style="grid-column:1/-1">В этой категории пока нет товаров.</div>';return}el.innerHTML=ps.map(p=>{const q=cart.find(x=>x.id===p.id)?.qty||0;return `<article class="product" data-product-id="${escAttr(p.id)}" onclick="openProductDetail('${p.id}')"><div class="pic">${p.image_url?`<img src="${escAttr(p.image_url)}" loading="lazy">`:'<div class="noimg">🍽️</div>'}</div><div class="body"><div class="name">${esc(p.name)}</div>${p.description?`<div class="desc">${esc(p.description)}</div>`:''}<div class="bottom"><div class="price">${money(p.price)}</div>${q?`<div class="qty"><button onclick="event.stopPropagation();changeQty('${p.id}',-1)">−</button><span>${q}</span><button onclick="event.stopPropagation();changeQty('${p.id}',1)">+</button></div>`:`<button class="add" onclick="event.stopPropagation();changeQty('${p.id}',1)">Добавить</button>`}</div></div></article>`}).join('')}
let activeProductId=null,detailCloseTimer=null;
function detailControlHtml(p,q){return q?`<div class="detail-qty"><button onclick="changeQty('${p.id}',-1)">−</button><span>${q}</span><button onclick="changeQty('${p.id}',1)">+</button></div>`:`<button class="detail-add" onclick="changeQty('${p.id}',1)">Добавить</button>`}
function openProductDetail(id){const p=menu.products.find(x=>x.id===id);if(!p)return;activeProductId=id;clearTimeout(detailCloseTimer);const q=cart.find(x=>x.id===id)?.qty||0;document.getElementById('detailContent').innerHTML=`<div class="detail-image">${p.image_url?`<img src="${escAttr(p.image_url)}" alt="${escAttr(p.name)}">`:'<div class="detail-noimg">🍽️</div>'}</div><div class="detail-content"><div class="detail-name">${esc(p.name)}</div>${p.description?`<div class="detail-desc">${esc(p.description)}</div>`:'<div class="detail-desc">Описание товара пока не добавлено.</div>'}<div class="detail-bottom"><div class="detail-price">${money(p.price)}</div><div id="detailControl">${detailControlHtml(p,q)}</div></div></div>`;const d=document.getElementById('productDetail');d.scrollTop=0;requestAnimationFrame(()=>d.classList.add('is-open'));document.body.style.overflow='hidden'}
function refreshProductDetail(id){if(activeProductId!==id)return;const p=menu.products.find(x=>x.id===id),control=document.getElementById('detailControl');if(!p||!control)return;const q=cart.find(x=>x.id===id)?.qty||0;control.innerHTML=detailControlHtml(p,q)}
function closeProductDetail(){const d=document.getElementById('productDetail');d.classList.remove('is-open');document.body.style.overflow='';clearTimeout(detailCloseTimer);detailCloseTimer=setTimeout(()=>{if(!d.classList.contains('is-open'))activeProductId=null},340)}
function changeQty(id,d){const p=menu.products.find(x=>x.id===id);if(!p)return;let x=cart.find(x=>x.id===id);if(!x&&d>0)cart.push({id,qty:1});else if(x){x.qty+=d;if(x.qty<=0)cart=cart.filter(y=>y.id!==id)}updateCart();updateProductCard(id);refreshProductDetail(id);animateCartAdd(d)}
function updateProductCard(id){const card=document.querySelector(`.product[data-product-id="${CSS.escape(id)}"]`);if(!card)return;const p=menu.products.find(x=>x.id===id),q=cart.find(x=>x.id===id)?.qty||0,bottom=card.querySelector('.bottom');if(!p||!bottom)return;bottom.innerHTML=`<div class="price">${money(p.price)}</div>${q?`<div class="qty"><button onclick="event.stopPropagation();changeQty('${p.id}',-1)">−</button><span class="qty-pop">${q}</span><button onclick="event.stopPropagation();changeQty('${p.id}',1)">+</button></div>`:`<button class="add" onclick="event.stopPropagation();changeQty('${p.id}',1)">Добавить</button>`}`}
function animateCartAdd(d){if(d<=0)return;const b=document.querySelector('.cartbtn');if(!b)return;b.classList.remove('cart-pulse');void b.offsetWidth;b.classList.add('cart-pulse')}
function updateCart(){const count=cart.reduce((s,x)=>s+x.qty,0);const subtotal=cart.reduce((s,x)=>s+(menu.products.find(p=>p.id===x.id)?.price||0)*x.qty,0);document.getElementById('cartCount').textContent=count;document.getElementById('cartTotal').textContent=money(subtotal);const bar=document.getElementById('cartbar');bar.style.display=count?'block':'none';bar.classList.toggle('is-visible',!!count);if(document.getElementById('cartModal').style.display==='flex')renderCart()}
function renderCart(){const el=document.getElementById('cartItems');el.innerHTML=cart.map(x=>{const p=menu.products.find(p=>p.id===x.id);return `<div class="row"><div class="itemmain"><div class="itemname">${esc(p.name)}</div><div class="itemsub">${money(p.price)} × ${x.qty}</div></div><div class="actions"><button onclick="changeQty('${p.id}',-1)">−</button><b>${x.qty}</b><button onclick="changeQty('${p.id}',1)">+</button></div></div>`}).join('');const subtotal=cart.reduce((s,x)=>s+(menu.products.find(p=>p.id===x.id)?.price||0)*x.qty,0);const fee=orderType==='Доставка'?getDeliveryFee():0;document.getElementById('checkoutTotal').textContent=money(subtotal+fee);document.getElementById('deliveryFeeText').textContent=money(fee)}
function openCart(){const m=document.getElementById('cartModal');m.style.display='flex';document.body.style.overflow='hidden';renderCart()}function closeCart(){const m=document.getElementById('cartModal');m.style.display='none';document.body.style.overflow='';const sh=m.querySelector('.sheet');if(sh){sh.style.transition='';sh.style.transform=''}}
let cartDragStartY=0,cartDragY=0,cartDragging=false,cartDragPointer=null;
(function setupCartDrag(){const m=document.getElementById('cartModal'),sh=m?.querySelector('.sheet'),h=m?.querySelector('.handle');if(!m||!sh||!h)return;
const move=y=>{if(!cartDragging)return;cartDragY=Math.max(0,y-cartDragStartY);sh.style.transform=`translateY(${cartDragY}px)`;m.style.background=`rgba(0,0,0,${Math.max(.08,.42-cartDragY/650)})`};
const finish=()=>{if(!cartDragging)return;cartDragging=false;cartDragPointer=null;if(cartDragY>38){collapseCartToButton()}else{sh.style.transition='transform .34s cubic-bezier(.22,1,.36,1)';sh.style.transform='translateY(0)';m.style.background='rgba(0,0,0,.42)'}};
const canStart=e=>{const r=sh.getBoundingClientRect();return e.clientY>=r.top&&e.clientY<=r.top+72};
sh.addEventListener('pointerdown',e=>{if(cartDragging||!canStart(e))return;e.preventDefault();cartDragging=true;cartDragPointer=e.pointerId;cartDragStartY=e.clientY;cartDragY=0;sh.style.transition='none';try{sh.setPointerCapture(e.pointerId)}catch(_){}});
window.addEventListener('pointermove',e=>{if(cartDragging&&e.pointerId===cartDragPointer){e.preventDefault();move(e.clientY)}},{passive:false});
window.addEventListener('pointerup',e=>{if(cartDragging&&e.pointerId===cartDragPointer)finish()});
window.addEventListener('pointercancel',e=>{if(cartDragging&&e.pointerId===cartDragPointer)finish()});
})();
function collapseCartToButton(){const m=document.getElementById('cartModal'),sh=m?.querySelector('.sheet');if(!m||!sh){closeCart();return}sh.style.transition='transform .48s cubic-bezier(.22,1,.36,1),opacity .38s cubic-bezier(.4,0,.2,1)';sh.style.transform='translate3d(0,105%,0)';sh.style.opacity='.12';m.style.transition='background-color .44s cubic-bezier(.4,0,.2,1)';m.style.background='rgba(0,0,0,0)';setTimeout(()=>{closeCart();sh.style.opacity='';sh.style.transform='';sh.style.transition='';m.style.background=''},490)}
function setType(t){orderType=t;document.getElementById('pickupBtn').classList.toggle('active',t==='Самовывоз');document.getElementById('deliveryBtn').classList.toggle('active',t==='Доставка');document.getElementById('deliveryFields').style.display=t==='Доставка'?'block':'none';document.getElementById('pickupFields').style.display=t==='Доставка'?'none':'block';renderCart()}
function getDeliveryFee(){return Number(window.__DELIVERY_FEE||0)}
async function submitOrder(){if(!cart.length)return;const delivery=orderType==='Доставка';const data={orderType,customerName:(document.getElementById(delivery?'name':'namePickup').value||'').trim(),phone:'+375'+(document.getElementById(delivery?'phone':'phonePickup').value||'').trim(),address:delivery?(document.getElementById('address').value||'').trim():'',comment:(document.getElementById(delivery?'comment':'commentPickup').value||'').trim(),items:cart.map(x=>({productId:x.id,quantity:x.qty,comment:null}))};if(!data.customerName||!data.phone||(delivery&&!data.address)){toast('Заполните имя, телефон и адрес для доставки');return}const validationError=OrderValidation.validate(data);if(validationError){toast(validationError);return}data.phone=OrderValidation.normalizePhone(data.phone);const btn=document.getElementById('submitBtn');btn.disabled=true;btn.textContent='Отправляем…';try{const r=await fetch(API+'/api/orders',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(data)});const j=await r.json();if(!r.ok)throw new Error(j.error||'Ошибка');saveTrackingToken(j.trackingToken);closeCart();document.getElementById('successModal').style.display='flex'}catch(e){toast(e.message||'Не удалось отправить заказ')}finally{btn.disabled=false;btn.textContent='Оформить заказ'}}
function statusInfo(status){return ['accepted','in_work','ready','delivering','completed'].includes(status)?['Заказ подтверждён','',true]:status==='new'?['Ожидает подтверждения','',false]:['Статус уточняется','',false]}
function formatPhoneInput(input){let value=input.value.trim();if(/^\+375/.test(value))value=value.slice(4);else if(/^375[\s(\d-]/.test(value)&&value.replace(/\D/g,'').length===12)value=value.slice(3);input.value=value.replace(/\D/g,'').slice(0,9);}
function toggleTracking(){const card=document.getElementById('trackingCard');if(card.hidden)showTracking();else hideTracking();}
function saveTrackingToken(token){trackingToken=String(token||'').trim();if(trackingToken)localStorage.setItem('prilavok_tracking_token',trackingToken);trackingOrder=null;startTrackingPolling()}
function updateTrackingLink(){const b=document.getElementById('trackingLink');if(b)b.style.display='block'}
function showTracking(){const card=document.getElementById('trackingCard');card.hidden=false;card.style.display='block';document.getElementById('trackingLink').setAttribute('aria-expanded','true');if(!trackingToken){card.innerHTML='<div class="muted">У вас пока нет заказов на этом устройстве.</div>';return}if(!trackingOrder)card.innerHTML='<div class="muted">Загружаем заказ…</div>';loadTracking(true);}
function closeSuccessAndShowTracking(){document.getElementById('successModal').style.display='none';showTracking()}
async function loadTracking(scroll){if(!trackingToken)return;try{const r=await fetch(API+'/api/orders/track/'+encodeURIComponent(trackingToken),{cache:'no-store'});if(r.status===404){trackingToken='';localStorage.removeItem('prilavok_tracking_token');updateTrackingLink();trackingOrder=null;document.getElementById('trackingCard').innerHTML='<div class="muted">Заказ не найден.</div>';return}const j=await r.json();if(!r.ok)throw new Error(j.error||'Ошибка');trackingOrder=j.order;renderTracking(j.order);if(scroll)document.getElementById('trackingCard').scrollIntoView({behavior:'smooth',block:'start'})}catch(e){if(scroll){if(!trackingOrder)document.getElementById('trackingCard').innerHTML='<div class="muted">Не удалось загрузить заказ. Закройте и откройте блок, чтобы повторить.</div>';toast('Не удалось загрузить статус заказа')}}}
function renderTracking(o){const card=document.getElementById('trackingCard');if(!card)return;const [label,note,confirmed]=statusInfo(o.status);const items=(o.order_items||[]).map(i=>`<div class="tracking-item"><span>${esc(i.product_name)} × ${Number(i.quantity||0)}</span><b>${money(Number(i.price||0)*Number(i.quantity||0))}</b></div>`).join('');card.innerHTML=`<div class="tracking-title">Ваш заказ</div><div class="tracking-id">${esc(o.external_id||'')}</div><div class="status-line">${confirmed?'<span class="status-check" aria-hidden="true">✓</span>':''}<div><div class="status-text">${esc(label)}</div><div class="status-note">${esc(note)}</div></div></div><div class="tracking-items">${items}<div class="total" style="padding-bottom:0"><span>Итого</span><span>${money(o.total)}</span></div></div><div class="tracking-actions"><button class="primary" onclick="loadTracking(true)">Обновить</button><button onclick="hideTracking()">Скрыть</button></div>`;if(confirmed){clearInterval(trackingTimer);trackingTimer=null;}}
function hideTracking(){const card=document.getElementById('trackingCard');if(card){card.hidden=true;card.style.display='none'}document.getElementById('trackingLink').setAttribute('aria-expanded','false')}
function startTrackingPolling(){updateTrackingLink();if(!trackingToken)return;loadTracking(false);clearInterval(trackingTimer);trackingTimer=setInterval(()=>loadTracking(false),2500)}
function toast(t){const e=document.getElementById('toast');e.textContent=t;e.style.display='block';clearTimeout(window.__toast);window.__toast=setTimeout(()=>e.style.display='none',2800)}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function escAttr(s){return esc(s)}
fetch(API+'/api/config').then(r=>r.json()).then(c=>{window.__DELIVERY_FEE=Number(c.deliveryFee||0)}).catch(()=>{});loadMenu();startTrackingPolling();
</script>
</body></html>
