<div class="wrap">
  <header class="hero"><div class="brand">Проект</div><h1>Онлайн заказ</h1></header>
<section class="roulette-entry"><button id="rouletteLaunch" class="roulette-launch" type="button" aria-haspopup="dialog"><span class="roulette-launch-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"></circle><path d="M12 3.5v3M20.5 12h-3M12 20.5v-3M3.5 12h3"></path><path d="m12 12 4.8-4.8"></path></svg></span><span class="roulette-launch-copy"><strong>Не можете выбрать?</strong><small>Крути рулетку</small></span><span class="roulette-launch-chevron" aria-hidden="true">›</span></button></section>
  <div id="cats" class="cats"></div>
  <main id="grid" class="grid"></main>
</div>
<div id="productDetail" class="product-detail"><div class="detail-inner"><div class="detail-top"><button class="back-btn" onclick="closeProductDetail()">← Назад</button><div class="brand">Проект</div></div><div id="detailContent"></div></div></div>
<div id="cartbar" class="cartbar"><button class="cartbtn" onclick="openCart()"><span>Корзина · <span id="cartCount">0</span></span><span id="cartTotal">0,00 BYN</span></button></div>
<div id="cartModal" class="modal" onclick="if(event.target===this)closeCart()"><div class="sheet"><div class="handle"></div><h2>Ваш заказ</h2><div id="cartItems"></div><div class="section"><label>Способ получения</label><div class="switches"><button id="pickupBtn" class="switch active" onclick="setType('Самовывоз')">🏠 Самовывоз</button><button id="deliveryBtn" class="switch" onclick="setType('Доставка')">🚗 Доставка</button></div></div><div id="deliveryFields" class="section" style="display:none"><label>Данные для доставки</label><input id="name" class="field" placeholder="Имя"><div class="phone-field"><span class="phone-prefix">+375</span><input id="phone" type="tel" inputmode="tel" autocomplete="tel-national" aria-label="Телефон, код страны +375" placeholder="29 123 45 67" oninput="formatPhoneInput(this)"></div><input id="address" class="field" placeholder="Адрес доставки"><input id="comment" class="field" placeholder="Комментарий к заказу"><div class="muted" style="font-size:13px"><span id="deliveryFeeText">Стоимость доставки будет рассчитана администратором</span></div></div><div id="pickupFields" class="section"><label>Контактные данные</label><input id="namePickup" class="field" placeholder="Имя"><div class="phone-field"><span class="phone-prefix">+375</span><input id="phonePickup" type="tel" inputmode="tel" autocomplete="tel-national" aria-label="Телефон, код страны +375" placeholder="29 123 45 67" oninput="formatPhoneInput(this)"></div><input id="commentPickup" class="field" placeholder="Комментарий к заказу"></div><div id="demandCard" class="demand-card is-normal" aria-live="polite" style="display:none"><div class="demand-title">Загруженность заведения</div><div class="demand-status">Обычная загруженность</div><div class="demand-note">Ваш заказ постараются приготовить быстро</div></div><div class="total"><span>Итого</span><span id="checkoutTotal">0,00 BYN</span></div><button id="submitBtn" class="checkout" onclick="submitOrder()">Оформить заказ</button></div></div>
<div id="toast" class="toast"></div>
<script src="/order-validation.js"></script>
<script src="/guest-menu-cache.js"></script>
<script src="/guest-catalog-view.js"></script>
<script src="/guest-roulette.js?v=roulette-20261010-3"></script>
<script>
const API=location.origin;let menu={categories:[],products:[]};let cart=[];let activeCat=null;let orderType='Самовывоз';let orderingRefreshBusy=false,orderingSubmitBusy=false;let demandTimer=null,demandRefreshTimer=null,demandController=null,demandSeq=0;const DEMAND_REFRESH_MS=25000,MENU_CACHE_FRESH_MS=7*24*60*60*1000;window.__DEMAND_LAST={available:true,demandState:'NORMAL',overload:false};window.__ORDER_HOURS={opensAt:'10:00',closesAt:'22:30',timeZone:'Europe/Minsk'};
const money=n=>Number(n||0).toLocaleString('ru-RU',{minimumFractionDigits:2,maximumFractionDigits:2})+' BYN';
function productLimit(p){if(p?.availability_known!==true)return 0;if(p.available_quantity===null)return Infinity;return Math.max(0,Math.floor(Number(p.available_quantity)||0))}
function reconcileCartAvailability(announce=false){let changed=false;cart=cart.flatMap(item=>{const p=menu.products.find(product=>product.id===item.id),limit=productLimit(p);if(!p||limit<=0){changed=true;return []}if(item.qty>limit){changed=true;return [{...item,qty:limit}]}return [item]});if(changed&&announce)toast('Корзина обновлена по актуальным остаткам');return changed}
function applyMenu(next,{announce=false}={}){if(!next||!Array.isArray(next.categories)||!Array.isArray(next.products))return false;const changed=GuestCatalogView.signature(menu)!==GuestCatalogView.signature(next);menu=next;reconcileCartAvailability(announce);if(changed){renderCats();renderProducts()}else refreshVisibleStock();updateCart();return true}
async function fetchMenu(revision='',{announce=false}={}){try{const suffix=revision?'?revision='+encodeURIComponent(revision):'';const r=await fetch(API+'/api/menu'+suffix);if(!r.ok)throw 0;const next=await r.json();if(!applyMenu(next,{announce}))throw 0;window.GuestMenuCache?.write('order',next);return true}catch(_e){return false}}
async function refreshMenuAvailability({announce=false}={}){try{const r=await fetch(API+'/api/menu/availability',{cache:'no-store'});if(!r.ok)throw 0;const payload=await r.json(),revision=String(payload?.catalog_revision||'');if(!menu.products.length||revision&&revision!==String(menu.catalog_revision||''))return fetchMenu(revision,{announce});const rows=Array.isArray(payload?.items)?payload.items:[],byExternalId=new Map(rows.map(row=>[String(row.external_id||''),row]));menu={...menu,products:menu.products.map(product=>{const row=byExternalId.get(String(product.external_id||''));return {...product,availability_known:!!row,available_quantity:row?row.available_quantity:0}})};reconcileCartAvailability(announce);refreshVisibleStock();updateCart();return true}catch(_e){return false}}
async function loadMenu(){const cached=window.GuestMenuCache?.read('order',MENU_CACHE_FRESH_MS);if(cached)applyMenu(cached.menu);const refreshed=await refreshMenuAvailability();if(!refreshed&&!cached&&!await fetchMenu())document.getElementById('grid').innerHTML='<div class="empty" style="grid-column:1/-1">Не удалось загрузить меню.<br>Попробуйте обновить страницу.</div>'}
function orderedCategories(){const priority=['пицца','горячее','салаты','закуски','сеты','десерты','холодные напитки','горячие напитки'];return [...menu.categories].sort((a,b)=>{const ai=priority.indexOf(String(a.name||'').trim().toLocaleLowerCase('ru-RU')),bi=priority.indexOf(String(b.name||'').trim().toLocaleLowerCase('ru-RU'));if(ai>=0&&bi>=0)return ai-bi;if(ai>=0)return-1;if(bi>=0)return 1;return 0})}
function renderCats(){const el=document.getElementById('cats'),cats=orderedCategories();if(!activeCat||!cats.some(c=>c.id===activeCat))activeCat=cats[0]?.id||null;el.innerHTML=cats.map(c=>`<button class="cat ${c.id===activeCat?'active':''}" data-cat="${c.id}" onclick="setCat('${c.id}')">${esc(c.name)}</button>`).join('')}
function setCat(id){activeCat=id;document.querySelectorAll('.cat').forEach(x=>x.classList.toggle('active',x.dataset.cat===id));renderProducts()}
function renderProducts(){const ps=activeCat?menu.products.filter(p=>p.category_id===activeCat):menu.products;const el=document.getElementById('grid');if(!ps.length){el.innerHTML='<div class="empty" style="grid-column:1/-1">В этой категории пока нет товаров.</div>';return}el.innerHTML=ps.map(p=>{const q=cart.find(x=>x.id===p.id)?.qty||0,limit=productLimit(p),available=limit>0;return `<article class="product ${available?'':'sold-out'}" data-product-id="${escAttr(p.id)}" ${available?`onclick="openProductDetail('${p.id}')"`:'aria-disabled="true"'}><div class="pic">${p.image_url?`<img src="${escAttr(p.image_url)}" alt="${escAttr(p.name)}" loading="lazy">`:'<div class="noimg">🍽️</div>'}${available?'':'<div class="sold-out-layer" aria-hidden="true"></div>'}</div><div class="body"><div class="name">${esc(p.name)}</div>${p.description?`<div class="desc">${esc(p.description)}</div>`:''}<div class="bottom"><div class="price">${money(p.price)}</div>${available?(q?`<div class="qty"><button onclick="event.stopPropagation();changeQty('${p.id}',-1)">−</button><span>${q}</span><button ${q>=limit?'disabled':''} onclick="event.stopPropagation();changeQty('${p.id}',1)">+</button></div>`:`<button class="add" onclick="event.stopPropagation();changeQty('${p.id}',1)">Добавить</button>`):'<div class="unavailable">Нет в наличии</div>'}</div></div></article>`}).join('')}
let activeProductId=null,detailCloseTimer=null;
function detailControlHtml(p,q){const limit=productLimit(p);if(limit<=0)return '<div class="unavailable">Нет в наличии</div>';return q?`<div class="detail-qty"><button onclick="changeQty('${p.id}',-1)">−</button><span>${q}</span><button ${q>=limit?'disabled':''} onclick="changeQty('${p.id}',1)">+</button></div>`:`<button class="detail-add" onclick="changeQty('${p.id}',1)">Добавить</button>`}
function openProductDetail(id){const p=menu.products.find(x=>x.id===id);if(!p)return;activeProductId=id;clearTimeout(detailCloseTimer);const q=cart.find(x=>x.id===id)?.qty||0;document.getElementById('detailContent').innerHTML=`<div class="detail-image">${p.image_url?`<img src="${escAttr(p.image_url)}" alt="${escAttr(p.name)}">`:'<div class="detail-noimg">🍽️</div>'}</div><div class="detail-content"><div class="detail-name">${esc(p.name)}</div>${p.description?`<div class="detail-desc">${esc(p.description)}</div>`:'<div class="detail-desc">Описание товара пока не добавлено.</div>'}<div class="detail-bottom"><div class="detail-price">${money(p.price)}</div><div id="detailControl">${detailControlHtml(p,q)}</div></div></div>`;const d=document.getElementById('productDetail');d.scrollTop=0;requestAnimationFrame(()=>d.classList.add('is-open'));document.body.style.overflow='hidden'}
function refreshProductDetail(id){if(activeProductId!==id)return;const p=menu.products.find(x=>x.id===id),control=document.getElementById('detailControl');if(!p||!control)return;const q=cart.find(x=>x.id===id)?.qty||0;control.innerHTML=detailControlHtml(p,q)}
function closeProductDetail(){const d=document.getElementById('productDetail');d.classList.remove('is-open');document.body.style.overflow='';clearTimeout(detailCloseTimer);detailCloseTimer=setTimeout(()=>{if(!d.classList.contains('is-open'))activeProductId=null},340)}
function changeQty(id,d){const p=menu.products.find(x=>x.id===id);if(!p)return;let x=cart.find(x=>x.id===id),limit=productLimit(p),current=x?.qty||0;if(d>0&&current>=limit){toast(limit>0?`Доступно только: ${limit}`:'Товар закончился');return}if(!x&&d>0)cart.push({id,qty:1});else if(x){x.qty+=d;if(x.qty<=0)cart=cart.filter(y=>y.id!==id)}updateCart();updateProductCard(id);refreshProductDetail(id);animateCartAdd(d)}
function refreshVisibleStock(){
 const byId=new Map(menu.products.map(p=>[String(p.id),p]));
 document.getElementById('grid').querySelectorAll('.product').forEach(card=>{
  const p=byId.get(String(card.dataset.productId));if(!p)return;const available=productLimit(p)>0;
  GuestCatalogView.stock(card,available,'.pic');
  if(available){card.removeAttribute('aria-disabled');card.onclick=()=>openProductDetail(p.id)}else{card.setAttribute('aria-disabled','true');card.onclick=null;card.removeAttribute('onclick')}
  updateProductCard(p.id);
 });
 if(activeProductId)refreshProductDetail(activeProductId);
}
function updateProductCard(id){const card=document.querySelector(`.product[data-product-id="${CSS.escape(id)}"]`);if(!card)return;const p=menu.products.find(x=>x.id===id),q=cart.find(x=>x.id===id)?.qty||0,bottom=card.querySelector('.bottom'),limit=productLimit(p);if(!p||!bottom)return;bottom.innerHTML=`<div class="price">${money(p.price)}</div>${limit<=0?'<div class="unavailable">Нет в наличии</div>':q?`<div class="qty"><button onclick="event.stopPropagation();changeQty('${p.id}',-1)">−</button><span class="qty-pop">${q}</span><button ${q>=limit?'disabled':''} onclick="event.stopPropagation();changeQty('${p.id}',1)">+</button></div>`:`<button class="add" onclick="event.stopPropagation();changeQty('${p.id}',1)">Добавить</button>`}`}
function animateCartAdd(d){if(d<=0)return;const b=document.querySelector('.cartbtn');if(!b)return;b.classList.remove('cart-pulse');void b.offsetWidth;b.classList.add('cart-pulse')}
function updateCart(){const count=cart.reduce((s,x)=>s+x.qty,0);const subtotal=cart.reduce((s,x)=>s+(menu.products.find(p=>p.id===x.id)?.price||0)*x.qty,0);document.getElementById('cartCount').textContent=count;document.getElementById('cartTotal').textContent=money(subtotal);const bar=document.getElementById('cartbar');bar.style.display=count?'block':'none';bar.classList.toggle('is-visible',!!count);if(document.getElementById('cartModal').style.display==='flex')renderCart();scheduleDemandStatus()}
function renderCart(){const el=document.getElementById('cartItems');el.innerHTML=cart.map(x=>{const p=menu.products.find(p=>p.id===x.id),limit=productLimit(p);return `<div class="row"><div class="itemmain"><div class="itemname">${esc(p.name)}</div><div class="itemsub">${money(p.price)} × ${x.qty}</div></div><div class="actions"><button onclick="changeQty('${p.id}',-1)">−</button><b>${x.qty}</b><button ${x.qty>=limit?'disabled':''} onclick="changeQty('${p.id}',1)">+</button></div></div>`}).join('');const subtotal=cart.reduce((s,x)=>s+(menu.products.find(p=>p.id===x.id)?.price||0)*x.qty,0);const fee=orderType==='Доставка'?getDeliveryFee():0;document.getElementById('checkoutTotal').textContent=money(subtotal+fee);document.getElementById('deliveryFeeText').textContent='Стоимость доставки будет рассчитана администратором';renderDemandStatus(window.__DEMAND_LAST);scheduleDemandStatus()}
function renderDemandStatus(data){
  window.__DEMAND_LAST=data;const el=document.getElementById('demandCard');if(!el)return;
  el.style.display='block';
  el.className='demand-card';
  if(!cart.length){el.style.display='none';return}el.style.display='block';
  if(data===undefined)data={available:true,demandState:'NORMAL',overload:false};
  if(!data?.available){el.classList.add('is-unavailable');el.innerHTML='<div class="demand-title">Загруженность заведения</div><div class="demand-status">Статус загруженности временно недоступен</div>';return}
  if(data.overload===true||data.demandState==='OVERLOAD'){
    el.classList.add('is-busy');
    el.innerHTML='<div class="demand-title">Загруженность заведения</div><div class="demand-status">Повышенная загруженность</div><div class="demand-note">Заказ может готовиться дольше обычного</div>';
    return;
  }
  el.classList.add('is-normal');el.innerHTML='<div class="demand-title">Загруженность заведения</div><div class="demand-status">Обычная загруженность</div><div class="demand-note">Ваш заказ постараются приготовить быстро</div>';
}

async function preloadDemandStatus(){try{const r=await fetch(API+'/api/demand/status',{cache:'no-store'});const data=await r.json();if(!r.ok)throw new Error();window.__DEMAND_LAST=data}catch(_e){window.__DEMAND_LAST={available:false}}}

function armDemandRefresh(){
  clearTimeout(demandRefreshTimer);demandRefreshTimer=null;
  if(!cart.length||document.hidden||document.getElementById('cartModal')?.style.display!=='flex')return;
  demandRefreshTimer=setTimeout(()=>scheduleDemandStatus({quiet:true}),DEMAND_REFRESH_MS);
}
function scheduleDemandStatus({quiet=false}={}){
  clearTimeout(demandTimer);clearTimeout(demandRefreshTimer);demandRefreshTimer=null;demandController?.abort();demandController=null;demandSeq++;
  if(!cart.length){const el=document.getElementById('demandCard');if(el)el.style.display='none';return}
  if(document.getElementById('cartModal')?.style.display!=='flex')return;
  const seq=demandSeq;
  demandTimer=setTimeout(async()=>{demandController=new AbortController();try{const r=await fetch(API+'/api/demand/status',{cache:'no-store',signal:demandController.signal});const d=await r.json();if(seq!==demandSeq)return;if(!r.ok)throw new Error(d?.error||'Demand status error');renderDemandStatus(d)}catch(e){if(e?.name!=='AbortError'&&seq===demandSeq)renderDemandStatus({available:false})}finally{if(seq===demandSeq){demandController=null;armDemandRefresh()}}},quiet?0:220);
}
function openCart(){const m=document.getElementById('cartModal');m.style.display='flex';document.body.style.overflow='hidden';renderCart();applyOrderingState();void refreshMenuAvailability({announce:true})}function closeCart(){demandSeq++;clearTimeout(demandTimer);clearTimeout(demandRefreshTimer);demandRefreshTimer=null;demandController?.abort();demandController=null;const m=document.getElementById('cartModal');m.style.display='none';document.body.style.overflow='';const sh=m.querySelector('.sheet');if(sh){sh.style.transition='';sh.style.transform=''}}
document.addEventListener('visibilitychange',()=>{if(document.hidden){clearTimeout(demandRefreshTimer);demandRefreshTimer=null}else if(document.getElementById('cartModal')?.style.display==='flex'&&cart.length)scheduleDemandStatus({quiet:true})});
window.addEventListener('online',()=>{if(document.getElementById('cartModal')?.style.display==='flex'&&cart.length)scheduleDemandStatus({quiet:true})});
let cartDragStartY=0,cartDragY=0,cartDragging=false,cartDragPointer=null;
(function setupCartDrag(){const m=document.getElementById('cartModal'),sh=m?.querySelector('.sheet'),h=m?.querySelector('.handle');if(!m||!sh||!h)return;
const move=y=>{if(!cartDragging)return;cartDragY=Math.max(0,y-cartDragStartY);sh.style.transform=`translateY(${cartDragY}px)`;m.style.background=`rgba(0,0,0,${Math.max(.08,.42-cartDragY/650)})`};
const finish=()=>{if(!cartDragging)return;cartDragging=false;cartDragPointer=null;if(cartDragY>38){collapseCartToButton()}else{sh.style.transition='transform .34s cubic-bezier(.22,1,.36,1)';sh.style.transform='translateY(0)';m.style.background='rgba(0,0,0,.42)'}};
const canStart=e=>{const r=sh.getBoundingClientRect();return e.clientY>=r.top&&e.clientY<=r.top+72};
sh.addEventListener('pointerdown',e=>{if(cartDragging||!canStart(e))return;e.preventDefault();cartDragging=true;cartDragPointer=e.pointerId;cartDragStartY=e.clientY;cartDragY=0;sh.style.transition='none';try{sh.setPointerCapture(e.pointerId)}catch(_){}});
window.addEventListener('pointermove',e=>{if(cartDragging&&e.pointerId===cartDragPointer){e.preventDefault();move(e.clientY)}},{passive:false});
window.addEventListener('pointerup',e=>{if(cartDragging&&e.pointerId===cartDragPointer)finish()});
window.addEventListener('pointercancel',e=>{if(cartDragging&&e.pointerId===cartDragPointer)finish()});
})();
function collapseCartToButton(){const m=document.getElementById('cartModal'),sh=m?.querySelector('.sheet');if(!m||!sh){closeCart();return}sh.style.transition='transform .48s cubic-bezier(.22,1,.36,1),opacity .38s cubic-bezier(.4,0,.2,1)';sh.style.transform='translate3d(0,105%,0)';sh.style.opacity='.12';m.style.transition='background-color .44s cubic-bezier(.4,0,.2,1)';m.style.background='rgba(0,0,0,0)';setTimeout(()=>{closeCart();sh.style.opacity='';sh.style.transform='';sh.style.transition='';m.style.background=''},490)}
function setType(t){orderType=t;document.getElementById('pickupBtn').classList.toggle('active',t==='Самовывоз');document.getElementById('deliveryBtn').classList.toggle('active',t==='Доставка');document.getElementById('deliveryFields').style.display=t==='Доставка'?'block':'none';document.getElementById('pickupFields').style.display=t==='Доставка'?'none':'block';renderCart()}
function getDeliveryFee(){return Number(window.__DELIVERY_FEE||0)}
function venueMinuteNow(){const h=window.__ORDER_HOURS;try{const parts=new Intl.DateTimeFormat('en-GB',{timeZone:h.timeZone,hour:'2-digit',minute:'2-digit',hourCycle:'h23'}).formatToParts(new Date()),values=Object.fromEntries(parts.map(part=>[part.type,part.value]));return Number(values.hour)*60+Number(values.minute)}catch(_e){return null}}
function orderingOpenNow(){if(typeof window.__ORDERING_OPEN==='boolean')return window.__ORDERING_OPEN;const minute=venueMinuteNow();return minute===null?window.__ORDERING_OPEN!==false:minute>=600&&minute<1350}
function applyOrderingState(){const btn=document.getElementById('submitBtn');if(!btn)return;const open=orderingOpenNow();btn.disabled=!open||orderingSubmitBusy;if(!orderingSubmitBusy)btn.textContent=open?'Оформить заказ':'Заказы принимаются с 10:00 до 22:30'}
async function refreshOrderingState(){if(orderingRefreshBusy||document.hidden)return;orderingRefreshBusy=true;const controller=new AbortController(),timeout=setTimeout(()=>controller.abort(),10000);try{const r=await fetch(API+'/api/config',{cache:'no-store',signal:controller.signal});if(!r.ok)throw new Error('Config unavailable');const c=await r.json();if(typeof c.orderingOpen!=='boolean')throw new Error('Invalid ordering state');window.__DELIVERY_FEE=Number(c.deliveryFee||0);window.__ORDERING_OPEN=c.orderingOpen;if(c.orderHours)window.__ORDER_HOURS=c.orderHours;applyOrderingState()}catch(_e){applyOrderingState()}finally{clearTimeout(timeout);orderingRefreshBusy=false}}
async function submitOrder(){if(orderingSubmitBusy||!cart.length)return;if(!orderingOpenNow()){toast('Онлайн-заказы принимаются с 10:00 до 22:30');applyOrderingState();return}orderingSubmitBusy=true;const btn=document.getElementById('submitBtn');btn.disabled=true;btn.textContent='Проверяем остатки…';try{await refreshMenuAvailability({announce:true});if(!cart.length)throw new Error('Выбранные товары закончились');const delivery=orderType==='Доставка';const data={orderType,customerName:(document.getElementById(delivery?'name':'namePickup').value||'').trim(),phone:'+375'+(document.getElementById(delivery?'phone':'phonePickup').value||'').trim(),address:delivery?(document.getElementById('address').value||'').trim():'',comment:(document.getElementById(delivery?'comment':'commentPickup').value||'').trim(),items:cart.map(x=>({productId:x.id,quantity:x.qty,comment:null}))};if(!data.customerName||!data.phone||(delivery&&!data.address))throw new Error('Заполните имя, телефон и адрес для доставки');const validationError=OrderValidation.validate(data);if(validationError)throw new Error(validationError);data.phone=OrderValidation.normalizePhone(data.phone);btn.textContent='Отправляем…';const r=await fetch(API+'/api/checkout',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(data)});const j=await r.json();if(!r.ok)throw new Error(j.error||'Ошибка');if(!j.telegramUrl)throw new Error('Не удалось открыть Telegram');location.href=j.telegramUrl}catch(e){toast(e.message||'Не удалось отправить заказ')}finally{orderingSubmitBusy=false;applyOrderingState()}}
function formatPhoneInput(input){let value=input.value.trim();if(/^\+375/.test(value))value=value.slice(4);else if(/^375[\s(\d-]/.test(value)&&value.replace(/\D/g,'').length===12)value=value.slice(3);input.value=value.replace(/\D/g,'').slice(0,9);}
function toast(t){const e=document.getElementById('toast');e.textContent=t;e.style.display='block';clearTimeout(window.__toast);window.__toast=setTimeout(()=>e.style.display='none',2800)}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function escAttr(s){return esc(s)}
