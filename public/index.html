<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Меню — Прилавок</title>
<style>
:root{--bg:#f6f6f4;--card:#fff;--text:#171717;--muted:#777;--line:#e8e8e5;--accent:#171717;--accentText:#fff;--soft:#efefec;--radius:20px}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",sans-serif;-webkit-font-smoothing:antialiased}
button,input,textarea{font:inherit}button{cursor:pointer;border:0}.wrap{max-width:760px;margin:auto;padding:0 16px 110px}.hero{padding:28px 4px 18px}.brand{font-size:13px;color:var(--muted);letter-spacing:.08em;text-transform:uppercase}.hero h1{font-size:34px;line-height:1.05;margin:7px 0 8px}.hero p{margin:0;color:var(--muted)}
.tracking-link{display:none;margin-top:14px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;font-weight:700;text-align:center}.tracking-card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:18px;margin:0 0 18px;display:none}.tracking-title{font-size:20px;font-weight:750;margin-bottom:4px}.tracking-id{font-size:13px;color:var(--muted);margin-bottom:16px}.status-line{display:flex;align-items:center;gap:10px}.status-dot{width:12px;height:12px;border-radius:50%;background:#171717;flex:none}.status-text{font-size:18px;font-weight:750}.status-note{font-size:13px;color:var(--muted);margin-top:6px}.tracking-items{margin-top:16px;padding-top:14px;border-top:1px solid var(--line)}.tracking-item{display:flex;justify-content:space-between;gap:10px;padding:7px 0}.tracking-actions{display:flex;gap:8px;margin-top:16px}.tracking-actions button{flex:1;background:var(--soft);border-radius:12px;padding:11px;font-weight:700}.tracking-actions button.primary{background:#171717;color:#fff}
.cats{display:flex;gap:8px;overflow:auto;padding:4px 0 16px;scrollbar-width:none}.cats::-webkit-scrollbar{display:none}.cat{white-space:nowrap;padding:10px 15px;border-radius:999px;background:var(--card);border:1px solid var(--line);color:#444}.cat.active{background:var(--accent);color:var(--accentText);border-color:var(--accent)}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.product{background:var(--card);border-radius:var(--radius);overflow:hidden;border:1px solid var(--line);display:flex;flex-direction:column;min-height:250px}.pic{height:150px;background:var(--soft);display:flex;align-items:center;justify-content:center;overflow:hidden}.pic img{width:100%;height:100%;object-fit:cover}.noimg{font-size:42px;opacity:.45}
.product{cursor:pointer}.product:active{transform:scale(.99)}
.product-detail{position:fixed;inset:0;background:var(--bg);z-index:30;display:none;overflow:auto}.detail-inner{max-width:760px;margin:auto;padding:0 16px max(28px,env(safe-area-inset-bottom))}.detail-top{position:sticky;top:0;z-index:2;display:flex;align-items:center;justify-content:space-between;padding:12px 0;background:rgba(246,246,244,.9);backdrop-filter:blur(16px)}.back-btn{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 14px;font-weight:650}.detail-image{width:100%;height:min(62vh,520px);border-radius:24px;overflow:hidden;background:var(--soft);display:flex;align-items:center;justify-content:center}.detail-image img{width:100%;height:100%;object-fit:cover}.detail-noimg{font-size:72px;opacity:.4}.detail-content{padding:20px 4px}.detail-name{font-size:30px;line-height:1.08;font-weight:750;margin-bottom:9px}.detail-desc{font-size:16px;line-height:1.5;color:var(--muted);white-space:pre-wrap}.detail-bottom{display:flex;align-items:center;justify-content:space-between;gap:14px;margin-top:24px}.detail-price{font-size:22px;font-weight:750}.detail-add{background:var(--accent);color:#fff;border-radius:14px;padding:14px 20px;font-weight:700;font-size:16px}.detail-qty{display:flex;align-items:center;background:var(--soft);border-radius:14px;overflow:hidden}.detail-qty button{width:44px;height:46px;background:transparent;font-size:23px}.detail-qty span{min-width:32px;text-align:center;font-weight:700;font-size:17px}.body{padding:13px;display:flex;flex-direction:column;gap:7px;flex:1}.name{font-weight:650;font-size:17px}.desc{font-size:13px;line-height:1.35;color:var(--muted);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}.bottom{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:auto}.price{font-weight:700;font-size:16px}.add{background:var(--accent);color:var(--accentText);border-radius:12px;padding:9px 13px;font-weight:650}.qty{display:flex;align-items:center;background:var(--soft);border-radius:12px;overflow:hidden}.qty button{width:34px;height:36px;background:transparent;font-size:20px}.qty span{min-width:25px;text-align:center;font-weight:650}
.empty{text-align:center;color:var(--muted);padding:50px 20px}.cartbar{position:fixed;left:0;right:0;bottom:0;padding:12px max(16px,calc((100vw - 760px)/2 + 16px));padding-bottom:max(12px,env(safe-area-inset-bottom));background:rgba(246,246,244,.9);backdrop-filter:blur(16px);border-top:1px solid var(--line);display:none}.cartbtn{width:100%;background:#171717;color:#fff;border-radius:16px;padding:15px 17px;display:flex;justify-content:space-between;font-weight:700}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.42);display:none;align-items:flex-end;z-index:10}.sheet{width:100%;max-width:760px;margin:auto;background:var(--card);border-radius:26px 26px 0 0;max-height:92vh;overflow:auto;padding:18px 16px max(22px,env(safe-area-inset-bottom))}.handle{width:42px;height:5px;background:#ddd;border-radius:5px;margin:0 auto 18px}.sheet h2{margin:0 0 16px;font-size:25px}.row{display:flex;justify-content:space-between;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}.row:last-child{border-bottom:0}.itemmain{flex:1}.itemname{font-weight:650}.itemsub{font-size:13px;color:var(--muted);margin-top:3px}.actions{display:flex;gap:7px;align-items:center}.actions button{width:32px;height:32px;border-radius:10px;background:var(--soft)}.section{margin-top:18px}.section label{display:block;font-size:13px;color:var(--muted);margin-bottom:7px}.switches{display:grid;grid-template-columns:1fr 1fr;gap:8px}.switch{padding:12px;border:1px solid var(--line);border-radius:13px;background:#fff;text-align:left}.switch.active{border-color:#171717;background:#171717;color:#fff}.field{width:100%;padding:13px;border:1px solid var(--line);border-radius:13px;outline:0;background:#fff;margin-bottom:8px}.field:focus{border-color:#999}.checkout{margin-top:18px;background:#171717;color:#fff;border-radius:15px;padding:15px;width:100%;font-weight:700}.checkout:disabled{opacity:.4}.total{display:flex;justify-content:space-between;font-size:18px;font-weight:750;padding:15px 0}.success{text-align:center;padding:40px 10px}.success .icon{font-size:52px}.success h2{margin:12px 0 7px}.muted{color:var(--muted)}.toast{position:fixed;left:50%;bottom:92px;transform:translateX(-50%);background:#171717;color:#fff;padding:11px 15px;border-radius:12px;display:none;z-index:20;font-size:14px}
@media(min-width:650px){.grid{grid-template-columns:repeat(3,minmax(0,1fr))}.pic{height:160px}}
</style>
</head>
<body>
<div class="wrap">
  <header class="hero"><div class="brand">Прилавок</div><h1>Меню</h1><p>Выберите блюда и оформите заказ онлайн.</p><button id="trackingLink" class="tracking-link" onclick="showTracking()">📦 Мой заказ</button></header>
  <section id="trackingCard" class="tracking-card"></section>
  <div id="cats" class="cats"></div>
  <main id="grid" class="grid"></main>
</div>
<div id="productDetail" class="product-detail"><div class="detail-inner"><div class="detail-top"><button class="back-btn" onclick="closeProductDetail()">← Назад</button><div class="brand">Прилавок</div></div><div id="detailContent"></div></div></div>
<div id="cartbar" class="cartbar"><button class="cartbtn" onclick="openCart()"><span>Корзина · <span id="cartCount">0</span></span><span id="cartTotal">0,00 BYN</span></button></div>
<div id="cartModal" class="modal" onclick="if(event.target===this)closeCart()"><div class="sheet"><div class="handle"></div><h2>Ваш заказ</h2><div id="cartItems"></div><div class="section"><label>Способ получения</label><div class="switches"><button id="pickupBtn" class="switch active" onclick="setType('Самовывоз')">🏠 Самовывоз</button><button id="deliveryBtn" class="switch" onclick="setType('Доставка')">🚗 Доставка</button></div></div><div id="deliveryFields" class="section" style="display:none"><label>Данные для доставки</label><input id="name" class="field" placeholder="Имя"><input id="phone" class="field" placeholder="Телефон"><input id="address" class="field" placeholder="Адрес доставки"><input id="comment" class="field" placeholder="Комментарий к заказу"><div class="muted" style="font-size:13px">Доставка: <span id="deliveryFeeText">0,00 BYN</span></div></div><div id="pickupFields" class="section"><label>Контактные данные</label><input id="namePickup" class="field" placeholder="Имя"><input id="phonePickup" class="field" placeholder="Телефон"><input id="commentPickup" class="field" placeholder="Комментарий к заказу"></div><div class="total"><span>Итого</span><span id="checkoutTotal">0,00 BYN</span></div><button id="submitBtn" class="checkout" onclick="submitOrder()">Оформить заказ</button></div></div>
<div id="successModal" class="modal"><div class="sheet"><div class="success"><div class="icon">✓</div><h2>Заказ принят</h2><p class="muted">Ваш заказ создан. Ниже можно следить за его статусом.</p><button class="checkout" onclick="closeSuccessAndShowTracking()">Следить за заказом</button></div></div></div>
<div id="toast" class="toast"></div>
<script>
const API=location.origin;let menu={categories:[],products:[]};let cart=[];let activeCat='all';let orderType='Самовывоз';let trackingToken=localStorage.getItem('prilavok_tracking_token')||'';let trackingTimer=null;let trackingOrder=null;
const money=n=>Number(n||0).toLocaleString('ru-RU',{minimumFractionDigits:2,maximumFractionDigits:2})+' BYN';
async function loadMenu(){try{const r=await fetch(API+'/api/menu');if(!r.ok)throw 0;menu=await r.json();renderCats();renderProducts()}catch(e){document.getElementById('grid').innerHTML='<div class="empty" style="grid-column:1/-1">Не удалось загрузить меню.<br>Попробуйте обновить страницу.</div>'}}
function renderCats(){const el=document.getElementById('cats');el.innerHTML='<button class="cat active" data-cat="all" onclick="setCat(\'all\')">Все</button>'+menu.categories.map(c=>`<button class="cat" data-cat="${c.id}" onclick="setCat('${c.id}')">${esc(c.name)}</button>`).join('')}
function setCat(id){activeCat=id;document.querySelectorAll('.cat').forEach(x=>x.classList.toggle('active',x.dataset.cat===id));renderProducts()}
function renderProducts(){const ps=menu.products.filter(p=>activeCat==='all'||p.category_id===activeCat);const el=document.getElementById('grid');if(!ps.length){el.innerHTML='<div class="empty" style="grid-column:1/-1">В этой категории пока нет товаров.</div>';return}el.innerHTML=ps.map(p=>{const q=cart.find(x=>x.id===p.id)?.qty||0;return `<article class="product" onclick="openProductDetail('${p.id}')"><div class="pic">${p.image_url?`<img src="${escAttr(p.image_url)}" loading="lazy">`:'<div class="noimg">🍽️</div>'}</div><div class="body"><div class="name">${esc(p.name)}</div>${p.description?`<div class="desc">${esc(p.description)}</div>`:''}<div class="bottom"><div class="price">${money(p.price)}</div>${q?`<div class="qty"><button onclick="event.stopPropagation();changeQty('${p.id}',-1)">−</button><span>${q}</span><button onclick="event.stopPropagation();changeQty('${p.id}',1)">+</button></div>`:`<button class="add" onclick="event.stopPropagation();changeQty('${p.id}',1)">Добавить</button>`}</div></div></article>`}).join('')}
function openProductDetail(id){const p=menu.products.find(x=>x.id===id);if(!p)return;const q=cart.find(x=>x.id===id)?.qty||0;document.getElementById('detailContent').innerHTML=`<div class="detail-image">${p.image_url?`<img src="${escAttr(p.image_url)}" alt="${escAttr(p.name)}">`:'<div class="detail-noimg">🍽️</div>'}</div><div class="detail-content"><div class="detail-name">${esc(p.name)}</div>${p.description?`<div class="detail-desc">${esc(p.description)}</div>`:'<div class="detail-desc">Описание товара пока не добавлено.</div>'}<div class="detail-bottom"><div class="detail-price">${money(p.price)}</div>${q?`<div class="detail-qty"><button onclick="changeQty('${p.id}',-1);refreshProductDetail('${p.id}')">−</button><span>${q}</span><button onclick="changeQty('${p.id}',1);refreshProductDetail('${p.id}')">+</button></div>`:`<button class="detail-add" onclick="changeQty('${p.id}',1);refreshProductDetail('${p.id}')">Добавить</button>`}</div></div>`;document.getElementById('productDetail').style.display='block';document.body.style.overflow='hidden';window.scrollTo(0,0)}
function refreshProductDetail(id){openProductDetail(id)}
function closeProductDetail(){document.getElementById('productDetail').style.display='none';document.body.style.overflow='';}
function changeQty(id,d){const p=menu.products.find(x=>x.id===id);if(!p)return;let x=cart.find(x=>x.id===id);if(!x&&d>0)cart.push({id,qty:1});else if(x){x.qty+=d;if(x.qty<=0)cart=cart.filter(y=>y.id!==id)}updateCart();renderProducts()}
function updateCart(){const count=cart.reduce((s,x)=>s+x.qty,0);const subtotal=cart.reduce((s,x)=>s+(menu.products.find(p=>p.id===x.id)?.price||0)*x.qty,0);document.getElementById('cartCount').textContent=count;document.getElementById('cartTotal').textContent=money(subtotal);document.getElementById('cartbar').style.display=count?'block':'none';if(document.getElementById('cartModal').style.display==='flex')renderCart()}
function renderCart(){const el=document.getElementById('cartItems');el.innerHTML=cart.map(x=>{const p=menu.products.find(p=>p.id===x.id);return `<div class="row"><div class="itemmain"><div class="itemname">${esc(p.name)}</div><div class="itemsub">${money(p.price)} × ${x.qty}</div></div><div class="actions"><button onclick="changeQty('${p.id}',-1)">−</button><b>${x.qty}</b><button onclick="changeQty('${p.id}',1)">+</button></div></div>`}).join('');const subtotal=cart.reduce((s,x)=>s+(menu.products.find(p=>p.id===x.id)?.price||0)*x.qty,0);const fee=orderType==='Доставка'?getDeliveryFee():0;document.getElementById('checkoutTotal').textContent=money(subtotal+fee);document.getElementById('deliveryFeeText').textContent=money(fee)}
function openCart(){document.getElementById('cartModal').style.display='flex';renderCart()}function closeCart(){document.getElementById('cartModal').style.display='none'}
function setType(t){orderType=t;document.getElementById('pickupBtn').classList.toggle('active',t==='Самовывоз');document.getElementById('deliveryBtn').classList.toggle('active',t==='Доставка');document.getElementById('deliveryFields').style.display=t==='Доставка'?'block':'none';document.getElementById('pickupFields').style.display=t==='Доставка'?'none':'block';renderCart()}
function getDeliveryFee(){return Number(window.__DELIVERY_FEE||0)}
async function submitOrder(){if(!cart.length)return;const delivery=orderType==='Доставка';const data={orderType,customerName:(document.getElementById(delivery?'name':'namePickup').value||'').trim(),phone:(document.getElementById(delivery?'phone':'phonePickup').value||'').trim(),address:delivery?(document.getElementById('address').value||'').trim():'',comment:(document.getElementById(delivery?'comment':'commentPickup').value||'').trim(),items:cart.map(x=>({productId:x.id,quantity:x.qty,comment:null}))};if(!data.customerName||!data.phone||(delivery&&!data.address)){toast('Заполните имя, телефон и адрес для доставки');return}const btn=document.getElementById('submitBtn');btn.disabled=true;btn.textContent='Отправляем…';try{const r=await fetch(API+'/api/orders',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(data)});const j=await r.json();if(!r.ok)throw new Error(j.error||'Ошибка');saveTrackingToken(j.trackingToken);closeCart();document.getElementById('successModal').style.display='flex'}catch(e){toast(e.message||'Не удалось отправить заказ')}finally{btn.disabled=false;btn.textContent='Оформить заказ'}}
function statusInfo(status){const map={new:['Новый','Заказ принят и ожидает подтверждения.'],accepted:['В работе','Заказ уже взят в работу кафе.'],in_work:['В работе','Заказ уже готовится.'],ready:['Готов','Заказ готов к выдаче.'],delivering:['Доставляется','Заказ передан курьеру.'],completed:['Выполнен','Заказ завершён.']};return map[String(status||'new')]||['Обновляется','Статус заказа обновляется.']}
function saveTrackingToken(token){trackingToken=String(token||'').trim();if(trackingToken)localStorage.setItem('prilavok_tracking_token',trackingToken);updateTrackingLink()}
function updateTrackingLink(){const b=document.getElementById('trackingLink');if(b)b.style.display=trackingToken?'block':'none'}
function showTracking(){const card=document.getElementById('trackingCard');if(card)card.style.display='block';loadTracking(true);window.scrollTo({top:0,behavior:'smooth'})}
function closeSuccessAndShowTracking(){document.getElementById('successModal').style.display='none';showTracking()}
async function loadTracking(scroll){if(!trackingToken)return;try{const r=await fetch(API+'/api/orders/track/'+encodeURIComponent(trackingToken),{cache:'no-store'});if(r.status===404){trackingToken='';localStorage.removeItem('prilavok_tracking_token');updateTrackingLink();document.getElementById('trackingCard').style.display='none';return}const j=await r.json();if(!r.ok)throw new Error(j.error||'Ошибка');trackingOrder=j.order;renderTracking(j.order);if(scroll)document.getElementById('trackingCard').scrollIntoView({behavior:'smooth',block:'start'})}catch(e){if(scroll)toast('Не удалось загрузить статус заказа')}}
function renderTracking(o){const card=document.getElementById('trackingCard');if(!card)return;const [label,note]=statusInfo(o.status);const items=(o.order_items||[]).map(i=>`<div class="tracking-item"><span>${esc(i.product_name)} × ${Number(i.quantity||0)}</span><b>${money(Number(i.price||0)*Number(i.quantity||0))}</b></div>`).join('');card.innerHTML=`<div class="tracking-title">Ваш заказ</div><div class="tracking-id">${esc(o.external_id||'')}</div><div class="status-line"><span class="status-dot"></span><div><div class="status-text">${esc(label)}</div><div class="status-note">${esc(note)}</div></div></div><div class="tracking-items">${items}<div class="total" style="padding-bottom:0"><span>Итого</span><span>${money(o.total)}</span></div></div><div class="tracking-actions"><button class="primary" onclick="loadTracking(true)">Обновить</button><button onclick="hideTracking()">Скрыть</button></div>`;card.style.display='block'}
function hideTracking(){const card=document.getElementById('trackingCard');if(card)card.style.display='none'}
function startTrackingPolling(){updateTrackingLink();if(!trackingToken)return;loadTracking(false);clearInterval(trackingTimer);trackingTimer=setInterval(()=>loadTracking(false),2500)}
function toast(t){const e=document.getElementById('toast');e.textContent=t;e.style.display='block';clearTimeout(window.__toast);window.__toast=setTimeout(()=>e.style.display='none',2800)}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function escAttr(s){return esc(s)}
fetch(API+'/api/config').then(r=>r.json()).then(c=>{window.__DELIVERY_FEE=Number(c.deliveryFee||0)}).catch(()=>{});loadMenu();startTrackingPolling();
</script>
</body></html>
